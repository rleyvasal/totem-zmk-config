include:
  # Production left = Studio-enabled. Official "just set CONFIG_ZMK_STUDIO=y"
  # is not enough on this board: the snippet attaches RPC to the XIAO board CDC
  # (one Totem serial port; printk is framed on the same stream). Studio UART
  # RX only starts when HID is on USB.
  - board: xiao_ble//zmk
    shield: totem_left
    snippet: totem-studio-rpc
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_RUNTIME_CONFIG=y
  - board: xiao_ble//zmk
    shield: totem_right
  - board: xiao_ble//zmk
    shield: settings_reset
  # Diagnostic build: left half with USB serial logging, for reading disconnect
  # reasons live (0x05 = key mismatch / bond rot, 0x08 = supervision timeout).
  # Flash only while debugging -- HID routes to USB and the radio contends with
  # BLE, so don't judge BLE behavior on this image.
  - board: xiao_ble//zmk
    shield: totem_left
    snippet: zmk-usb-logging
    artifact-name: totem_left_logging
  # Alternate explicitly named Studio artifact. It uses the same Studio and
  # Runtime Config feature set as production totem_left.
  #
  # Local snippet totem-studio-rpc (not upstream studio-rpc-usb-uart). One CDC:
  # Studio RPC plus framed printk (TOTEM_STUDIO_CONSOLE).
  - board: xiao_ble//zmk
    shield: totem_left
    snippet: totem-studio-rpc
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_RUNTIME_CONFIG=y
    artifact-name: totem_left_studio
