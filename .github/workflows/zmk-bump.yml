name: Bump ZMK

# Merge upstream into the pinned custom fork, retaining all custom features.
# ZMK_FORK_TOKEN needs Contents:write on rleyvasal/zmk-next.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: "Upstream version to merge into the custom firmware"
        type: choice
        required: true
        default: release
        options: [release, main, ref]
      ref:
        description: "Upstream tag, branch, or SHA when mode=ref"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: zmk-bump-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/zmkfirmware/zmk.git
  UPSTREAM_REPO: zmkfirmware/zmk
  FORK_REPO: rleyvasal/zmk-next

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config
        uses: actions/checkout@v5

      - name: Resolve upstream target
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'release' }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          RELEASE_TAG=""
          RELEASE_URL=""
          case "$MODE" in
            release)
              meta=$(gh api "repos/${UPSTREAM_REPO}/releases/latest")
              RELEASE_TAG=$(jq -r .tag_name <<< "$meta")
              RELEASE_URL=$(jq -r .html_url <<< "$meta")
              LABEL="$RELEASE_TAG"
              ;;
            main) LABEL=main ;;
            ref)
              if [ -z "$INPUT_REF" ]; then
                echo "::error::mode=ref requires an upstream ref"
                exit 1
              fi
              LABEL="$INPUT_REF"
              ;;
            *) exit 1 ;;
          esac
          SHA=$(gh api "repos/${UPSTREAM_REPO}/commits/${LABEL}" --jq .sha)
          {
            echo "mode=$MODE"
            echo "sha=$SHA"
            echo "short=${SHA:0:7}"
            echo "label=$LABEL"
            echo "release_tag=$RELEASE_TAG"
            echo "release_url=$RELEASE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch pinned custom firmware and check ancestry
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT=$(awk '/name: zmk/,/revision:/ { if ($1 == "revision:") { print $2; exit } }' config/west.yml)
          REPO_PATH=$(awk '/name: zmk/,/revision:/ { if ($1 == "repo-path:") { print $2; exit } }' config/west.yml)
          if [ "$FORK_REPO" != "rleyvasal/$REPO_PATH" ] || [ -z "$CURRENT" ]; then
            echo "::error::Update repository must match the firmware repository in west.yml"
            exit 1
          fi
          git clone --filter=blob:none --no-checkout "https://github.com/${FORK_REPO}.git" zmk
          git -C zmk fetch origin "$CURRENT"
          CURRENT=$(git -C zmk rev-parse FETCH_HEAD)
          git -C zmk fetch "$UPSTREAM" "$SHA"
          if git -C zmk merge-base --is-ancestor "$SHA" "$CURRENT"; then
            echo "Pinned firmware already contains upstream ${SHA:0:7}; no update needed."
            echo "status=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BR="zmk-bump-${CURRENT:0:7}-${SHA:0:7}"
          if [ -n "$(gh pr list --head "$BR" --state open --json url --jq '.[0].url // empty')" ]; then
            echo "An update PR already exists for $BR."
            echo "status=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C zmk checkout -b "$BR" "$CURRENT"
          {
            echo "status=needed"
            echo "branch=$BR"
          } >> "$GITHUB_OUTPUT"

      - name: Merge upstream and test custom firmware
        id: merge
        if: steps.plan.outputs.status == 'needed'
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -euo pipefail
          git -C zmk config user.name zmk-bump-bot
          git -C zmk config user.email actions@users.noreply.github.com
          if ! bash tools/merge_zmk_update.sh zmk "$SHA"; then
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 zmk/app/tests/studio/raw_tx/test_raw_tx.py -v
          python3 zmk/app/tests/ble/active_connection/test_active_connection.py -v
          python3 zmk/app/tests/ble/profile_notifications/test_profile_notifications.py -v
          python3 zmk/app/tests/settings/startup/test_settings_loaded.py -v
          python3 zmk/app/tests/battery/persistence/test_persistence.py -v
          git -C zmk commit -m "Merge upstream ZMK ${SHA:0:7} into custom firmware"
          echo "status=clean" >> "$GITHUB_OUTPUT"

      - name: Publish firmware update branch
        if: steps.merge.outputs.status == 'clean'
        env:
          FORK_TOKEN: ${{ secrets.ZMK_FORK_TOKEN }}
          BR: ${{ steps.plan.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "${FORK_TOKEN:-}" ]; then
            echo "::error::ZMK_FORK_TOKEN needs Contents:write on ${FORK_REPO}"
            exit 1
          fi
          git -C zmk push "https://x-access-token:${FORK_TOKEN}@github.com/${FORK_REPO}.git" "$BR"

      - name: Open configuration update PR
        if: steps.merge.outputs.status == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
          BR: ${{ steps.plan.outputs.branch }}
          BASE: ${{ github.ref_name }}
          MODE: ${{ steps.ref.outputs.mode }}
          SHA: ${{ steps.ref.outputs.sha }}
          SHORT: ${{ steps.ref.outputs.short }}
          LABEL: ${{ steps.ref.outputs.label }}
          RELEASE_TAG: ${{ steps.ref.outputs.release_tag }}
          RELEASE_URL: ${{ steps.ref.outputs.release_url }}
        run: |
          set -euo pipefail
          FORK_TIP=$(git -C zmk rev-parse HEAD)
          git config user.name zmk-bump-bot
          git config user.email actions@users.noreply.github.com
          git checkout -b "$BR"
          sed -i '/name: zmk/,/revision:/ s|revision: .*|revision: '"$FORK_TIP"'|' config/west.yml
          git add config/west.yml
          git commit -m "Bump custom ZMK firmware to ${LABEL} (${FORK_TIP:0:7})"
          git push origin "$BR"
          export FORK_TIP
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('.github/zmk-bump-pr-body.md').read_text()
          for name in ('MODE', 'SHA', 'SHORT', 'LABEL', 'FORK_TIP', 'RELEASE_TAG', 'RELEASE_URL'):
              text = text.replace(f'__{name}__', os.environ[name])
          text = text.replace('__FORKBRANCH__', os.environ['BR'])
          Path('/tmp/zmk-bump-pr-body.md').write_text(text)
          PY
          gh pr create --base "$BASE" --head "$BR" \
            --title "Bump custom ZMK to ${LABEL} (${SHORT})" \
            --body-file /tmp/zmk-bump-pr-body.md

      - name: Report upstream merge conflict
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.ref.outputs.short }}
        run: |
          set -euo pipefail
          TITLE="ZMK update ${SHORT}: custom firmware needs a merge"
          if [ -n "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')" ]; then
            exit 0
          fi
          gh issue create --title "$TITLE" \
            --body "Merging upstream ${SHORT} into the pinned custom firmware conflicted. Resolve the merge in ${FORK_REPO}, retaining the Studio, runtime configuration, diagnostic, battery, and BLE changes. No new firmware revision was pinned."
