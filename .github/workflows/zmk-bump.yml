name: Bump ZMK

# Weekly Totem firmware update. The stack is:
#   zmkfirmware/zmk -> rleyvasal/zmk-next (synced and released weekly)
#     -> this config (config/west.yml pins an exact zmk-next commit)
#
# Each run checks the latest ZMK Next release. If it is newer than the pinned
# commit, it runs ZMK Next's native tests at that release, then opens a PR here
# that moves the west.yml pin. The PR's build produces the firmware to flash;
# merge it only after a hardware check. Nothing is ever merged automatically.
# A pin that is already newer than the latest release (for example a main
# commit pinned between releases) is left alone.

on:
  schedule:
    # ZMK Next's own sync runs at 06:17 UTC on Mondays.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: zmk-bump
  cancel-in-progress: false

env:
  NEXT_REPO: rleyvasal/zmk-next

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Compare the pin with the latest ZMK Next release
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${NEXT_REPO}/releases/latest" --jq .tag_name)
          current=$(awk '/name: zmk$/,/revision:/ { if ($1 == "revision:") { print $2; exit } }' config/west.yml)
          repo_path=$(awk '/name: zmk$/,/revision:/ { if ($1 == "repo-path:") { print $2; exit } }' config/west.yml)
          if [ "$repo_path" != "zmk-next" ]; then
            echo "::error::config/west.yml's zmk project is not rleyvasal/zmk-next (repo-path: ${repo_path})"
            exit 1
          fi

          git clone --filter=blob:none --no-checkout "https://github.com/${NEXT_REPO}.git" zmk
          git -C zmk fetch --filter=blob:none origin "refs/tags/${tag}:refs/tags/${tag}" "$current"
          sha=$(git -C zmk rev-parse "${tag}^{commit}")

          if git -C zmk merge-base --is-ancestor "$sha" "$current"; then
            echo "Pinned ${current:0:7} already includes ZMK Next ${tag}; nothing to do."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git -C zmk checkout -q "$sha"

      - name: Test ZMK Next at the release
        if: steps.next.outputs.bump == 'true'
        run: |
          set -euo pipefail
          for test in $(cd zmk && git ls-files 'app/tests/**/test_*.py'); do
            echo "== $test"
            python3 "zmk/$test" -v
          done

      - name: Open the config PR
        if: steps.next.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.next.outputs.sha }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          br="zmk-bump-${TAG}-${SHA:0:7}"
          if [ -n "$(gh pr list --head "$br" --state open --json url --jq '.[0].url // empty')" ]; then
            echo "A PR for $br is already open."
            exit 0
          fi

          python3 - "$SHA" <<'PY'
          import re, sys
          path = "config/west.yml"
          text = open(path).read()
          block = re.search(r"^    - name: zmk\n(?:      .*\n|\s*#.*\n)*", text, re.M)
          new = re.sub(r"^      revision: .*$", f"      revision: {sys.argv[1]}", block.group(0), flags=re.M)
          open(path, "w").write(text.replace(block.group(0), new))
          PY

          git config user.name zmk-bump-bot
          git config user.email actions@users.noreply.github.com
          git checkout -b "$br"
          git commit -am "Bump ZMK Next to ${TAG} (${SHA:0:7})"
          git push origin "$br"

          cat > /tmp/body.md <<EOF
          Moves \`config/west.yml\` to [${NEXT_REPO}@${SHA:0:7}](https://github.com/${NEXT_REPO}/commit/${SHA}), ZMK Next [${TAG}](https://github.com/${NEXT_REPO}/releases/tag/${TAG}). ZMK Next's native tests passed at that commit.

          The firmware build for this branch is started automatically; download its artifacts from the Actions tab.

          **Merge only after flashing both halves and checking:**

          - [ ] Typing on both halves, including homerow mods and combos
          - [ ] Profile switching with \`&bt BT_SEL\`
          - [ ] Only the active host stays connected
          - [ ] The selected host reconnects cleanly; USB typing stays stable
          - [ ] Retained logs can be read and live logs don't stall typing
          - [ ] Both halves' battery levels, charging and the 'K' line
          - [ ] Idle battery drain stays around 0.5 to 0.9 %/hr

          If anything regresses, close this PR. The keyboard stays on the current pin.
          EOF
          title="Bump ZMK Next to ${TAG}"
          if ! gh pr create --base main --head "$br" --title "$title" --body-file /tmp/body.md; then
            # Opening PRs needs "Allow GitHub Actions to create and approve pull
            # requests" in the repo's Actions settings. Without it, file an issue
            # that links straight to the PR form for the pushed branch.
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${br}?expand=1"
            { echo "New Totem firmware is ready on branch \`${br}\`. [Open the PR](${compare}) to review and merge it."; echo; cat /tmp/body.md; } > /tmp/issue.md
            gh issue create --title "$title" --body-file /tmp/issue.md
          fi

          # PRs opened with GITHUB_TOKEN don't trigger workflows, so start the
          # firmware build for the branch explicitly.
          gh workflow run build.yml --ref "$br"
          gh workflow run verify-zmk-patch.yml --ref "$br" || true
