name: Bump ZMK

# Weekly Totem firmware update. The stack is:
#   zmkfirmware/zmk -> rleyvasal/zmk-next (synced and released weekly)
#     -> this config (config/west.yml pins exact zmk-next and zmk-studio-log
#        commits, so firmware only changes when a pin PR is merged)
#
# Each run checks the latest ZMK Next and zmk-studio-log releases. If either is
# newer than its pinned commit, it runs ZMK Next's native tests at the new ZMK
# Next release (when there is one), then opens one PR here that moves the
# west.yml pins. The PR's build produces the firmware to flash;
# merge it only after a hardware check. Nothing is ever merged automatically.
# A pin that is already newer than the latest release (for example a main
# commit pinned between releases) is left alone.

on:
  schedule:
    # ZMK Next's own sync runs at 06:17 UTC on Mondays.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: zmk-bump
  cancel-in-progress: false

env:
  NEXT_REPO: rleyvasal/zmk-next
  LOG_REPO: rleyvasal/zmk-studio-log

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Compare the pins with the latest releases
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_path=$(awk '/name: zmk$/,/revision:/ { if ($1 == "repo-path:") { print $2; exit } }' config/west.yml)
          if [ "$repo_path" != "zmk-next" ]; then
            echo "::error::config/west.yml's zmk project is not rleyvasal/zmk-next (repo-path: ${repo_path})"
            exit 1
          fi

          # check <project> <repo> <dir>: sets <dir>_bump, _tag and _sha, and
          # leaves <dir> checked out at the release when it is newer.
          check() {
            local project=$1 repo=$2 dir=$3 tag current sha
            tag=$(gh api "repos/${repo}/releases/latest" --jq .tag_name)
            current=$(awk "/name: ${project}\$/,/revision:/ { if (\$1 == \"revision:\") { print \$2; exit } }" config/west.yml)
            if ! [[ "$current" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${project} is pinned to '${current}', not an exact commit"
              exit 1
            fi
            git clone -q --filter=blob:none --no-checkout "https://github.com/${repo}.git" "$dir"
            git -C "$dir" fetch -q --filter=blob:none origin "refs/tags/${tag}:refs/tags/${tag}" "$current"
            sha=$(git -C "$dir" rev-parse "${tag}^{commit}")
            if git -C "$dir" merge-base --is-ancestor "$sha" "$current"; then
              echo "${project}: pinned ${current:0:7} already includes ${tag}."
              echo "${dir}_bump=false" >> "$GITHUB_OUTPUT"
              return
            fi
            echo "${project}: ${current:0:7} -> ${tag} (${sha:0:7})"
            git -C "$dir" checkout -q "$sha"
            { echo "${dir}_bump=true"; echo "${dir}_tag=$tag"; echo "${dir}_sha=$sha"; } >> "$GITHUB_OUTPUT"
          }
          check zmk "$NEXT_REPO" zmk
          check zmk-studio-log "$LOG_REPO" log

      - name: Test ZMK Next at the release
        if: steps.next.outputs.zmk_bump == 'true'
        run: |
          set -euo pipefail
          for test in $(cd zmk && git ls-files 'app/tests/**/test_*.py'); do
            echo "== $test"
            python3 "zmk/$test" -v
          done

      - name: Open the config PR
        if: steps.next.outputs.zmk_bump == 'true' || steps.next.outputs.log_bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZMK_SHA: ${{ steps.next.outputs.zmk_sha }}
          ZMK_TAG: ${{ steps.next.outputs.zmk_tag }}
          LOG_SHA: ${{ steps.next.outputs.log_sha }}
          LOG_TAG: ${{ steps.next.outputs.log_tag }}
        run: |
          set -euo pipefail
          parts=() lines=() br="zmk-bump"
          if [ -n "$ZMK_SHA" ]; then
            parts+=("ZMK Next ${ZMK_TAG}")
            br+="-${ZMK_TAG}-${ZMK_SHA:0:7}"
            lines+=("- ZMK Next [${ZMK_TAG}](https://github.com/${NEXT_REPO}/releases/tag/${ZMK_TAG}) ([${ZMK_SHA:0:7}](https://github.com/${NEXT_REPO}/commit/${ZMK_SHA})). ZMK Next's native tests passed at that commit.")
          fi
          if [ -n "$LOG_SHA" ]; then
            parts+=("zmk-studio-log ${LOG_TAG}")
            br+="-log-${LOG_TAG}-${LOG_SHA:0:7}"
            lines+=("- zmk-studio-log [${LOG_TAG}](https://github.com/${LOG_REPO}/releases/tag/${LOG_TAG}) ([${LOG_SHA:0:7}](https://github.com/${LOG_REPO}/commit/${LOG_SHA})).")
          fi
          if [ -n "$(gh pr list --head "$br" --state open --json url --jq '.[0].url // empty')" ]; then
            echo "A PR for $br is already open."
            exit 0
          fi

          python3 - "$ZMK_SHA" "$LOG_SHA" <<'PY'
          import re, sys
          path = "config/west.yml"
          text = open(path).read()
          for project, sha in (("zmk", sys.argv[1]), ("zmk-studio-log", sys.argv[2])):
              if not sha:
                  continue
              block = re.search(rf"^    - name: {re.escape(project)}\n(?:      .*\n|\s*#.*\n)*", text, re.M)
              new = re.sub(r"^      revision: .*$", f"      revision: {sha}", block.group(0), flags=re.M)
              text = text.replace(block.group(0), new)
          open(path, "w").write(text)
          PY

          summary=$(IFS=,; echo "${parts[*]}" | sed 's/,/ and /')
          git config user.name zmk-bump-bot
          git config user.email actions@users.noreply.github.com
          git checkout -b "$br"
          git commit -am "Bump ${summary}"
          git push origin "$br"

          {
            echo "Moves \`config/west.yml\` to:"
            echo
            printf '%s\n' "${lines[@]}"
            cat <<'EOF'

          The firmware build for this branch is started automatically; download its artifacts from the Actions tab.

          **Merge only after flashing both halves and checking:**

          - [ ] Typing on both halves, including homerow mods and combos
          - [ ] Profile switching with `&bt BT_SEL`
          - [ ] Only the active host stays connected
          - [ ] The selected host reconnects cleanly; USB typing stays stable
          - [ ] Retained logs can be read and live logs don't stall typing
          - [ ] Both halves' battery levels, charging and the 'K' line
          - [ ] Idle battery drain stays around 0.5 to 0.9 %/hr

          If anything regresses, close this PR. The keyboard stays on the current pins.
          EOF
          } > /tmp/body.md
          title="Bump ${summary}"
          if ! gh pr create --base main --head "$br" --title "$title" --body-file /tmp/body.md; then
            # Opening PRs needs "Allow GitHub Actions to create and approve pull
            # requests" in the repo's Actions settings. Without it, file an issue
            # that links straight to the PR form for the pushed branch.
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${br}?expand=1"
            { echo "New Totem firmware is ready on branch \`${br}\`. [Open the PR](${compare}) to review and merge it."; echo; cat /tmp/body.md; } > /tmp/issue.md
            gh issue create --title "$title" --body-file /tmp/issue.md
          fi

          # PRs opened with GITHUB_TOKEN don't trigger workflows, so start the
          # firmware build for the branch explicitly.
          gh workflow run build.yml --ref "$br"
          gh workflow run verify-zmk-patch.yml --ref "$br" || true
