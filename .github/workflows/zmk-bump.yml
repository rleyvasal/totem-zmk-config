name: Bump ZMK

# Weekly Totem firmware update. The stack is:
#   zmkfirmware/zmk -> rleyvasal/zmk-next (synced and released weekly)
#     -> rleyvasal/zmk-totem branch `totem` (ZMK Next + Totem patches)
#       -> this config (west.yml pins an exact zmk-totem commit)
#
# Each run merges the latest ZMK Next release into zmk-totem's `totem` branch,
# runs the Totem firmware tests, pushes the branch, and opens a PR here that
# moves the west.yml pin. The PR's build produces the firmware to flash; merge
# it only after a hardware check. Nothing is ever merged automatically.
#
# Setup: ZMK_FORK_TOKEN is a fine-grained token with Contents write on
# rleyvasal/zmk-totem (plus Workflows write, so merges that update workflow
# files can be pushed).

on:
  schedule:
    # ZMK Next's own sync runs at 06:17 UTC on Mondays.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: zmk-bump
  cancel-in-progress: false

env:
  NEXT_REPO: rleyvasal/zmk-next
  FORK_REPO: rleyvasal/zmk-totem
  FORK_BRANCH: totem
  # Branch that carries the ZMK Next work until it merges into main. Once
  # main's west.yml points at zmk-totem, main is used instead.
  WORK_BRANCH: persistent-diagnostic-log

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the config branch
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/contents/config/west.yml?ref=main" --jq .content \
              | base64 -d | grep -q 'repo-path: zmk-totem'; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$WORK_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.base.outputs.branch }}

      - name: Merge the latest ZMK Next release into the Totem fork
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${NEXT_REPO}/releases/latest" --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          git clone --filter=blob:none --branch "$FORK_BRANCH" "https://github.com/${FORK_REPO}.git" zmk
          git -C zmk config user.name zmk-bump-bot
          git -C zmk config user.email actions@users.noreply.github.com
          git -C zmk fetch --filter=blob:none "https://github.com/${NEXT_REPO}.git" "refs/tags/${tag}:refs/tags/${tag}"

          if git -C zmk merge-base --is-ancestor "$tag" HEAD; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          elif git -C zmk merge --no-edit -m "Merge ZMK Next ${tag} into ${FORK_BRANCH}" "$tag"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            # zmk-totem's README (the Totem patch summary) always wins; ZMK Next's
            # docs always win. Anything else needs a person.
            if git -C zmk diff --name-only --diff-filter=U | grep -qx 'README\.md'; then
              git -C zmk checkout --ours -- README.md
              git -C zmk add -- README.md
            fi
            git -C zmk diff --name-only --diff-filter=U | grep -E '^docs/' \
              | xargs -r git -C zmk checkout --theirs --
            git -C zmk diff --name-only --diff-filter=U | grep -E '^docs/' \
              | xargs -r git -C zmk add --
            if [ -n "$(git -C zmk diff --name-only --diff-filter=U)" ]; then
              git -C zmk diff --name-only --diff-filter=U | tee conflicts.txt
              git -C zmk merge --abort
              echo "status=conflict" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C zmk commit --no-edit
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git -C zmk rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "status=merged" >> "$GITHUB_OUTPUT"

      - name: Test the Totem firmware
        if: steps.merge.outputs.status == 'merged'
        run: |
          set -euo pipefail
          python3 zmk/app/tests/studio/raw_tx/test_raw_tx.py -v
          python3 zmk/app/tests/ble/active_connection/test_active_connection.py -v
          python3 zmk/app/tests/ble/profile_notifications/test_profile_notifications.py -v
          python3 zmk/app/tests/settings/startup/test_settings_loaded.py -v
          python3 zmk/app/tests/battery/persistence/test_persistence.py -v

      - name: Push the Totem fork
        if: steps.merge.outputs.status == 'merged' && steps.merge.outputs.pushed == 'true'
        env:
          FORK_TOKEN: ${{ secrets.ZMK_FORK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FORK_TOKEN:-}" ]; then
            echo "::error::ZMK_FORK_TOKEN needs Contents write on ${FORK_REPO}"
            exit 1
          fi
          git -C zmk push "https://x-access-token:${FORK_TOKEN}@github.com/${FORK_REPO}.git" "HEAD:${FORK_BRANCH}"

      - name: Open the config PR
        if: steps.merge.outputs.status == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.branch }}
          SHA: ${{ steps.merge.outputs.sha }}
          TAG: ${{ steps.merge.outputs.tag }}
        run: |
          set -euo pipefail
          current=$(awk '/name: zmk$/,/revision:/ { if ($1 == "revision:") { print $2; exit } }' config/west.yml)
          repo_path=$(awk '/name: zmk$/,/revision:/ { if ($1 == "repo-path:") { print $2; exit } }' config/west.yml)
          if [ "$current" = "$SHA" ] && [ "$repo_path" = "zmk-totem" ]; then
            echo "config/west.yml already pins ${SHA:0:7}; nothing to do."
            exit 0
          fi
          br="zmk-bump-${TAG}-${SHA:0:7}"
          if [ -n "$(gh pr list --head "$br" --state open --json url --jq '.[0].url // empty')" ]; then
            echo "A PR for $br is already open."
            exit 0
          fi

          python3 - "$SHA" <<'PY'
          import re, sys
          path = "config/west.yml"
          text = open(path).read()
          block = re.search(r"^    - name: zmk\n(?:      .*\n|\s*#.*\n)*", text, re.M)
          new = re.sub(r"^      revision: .*$", f"      revision: {sys.argv[1]}", block.group(0), flags=re.M)
          if re.search(r"^      repo-path: ", new, re.M):
              new = re.sub(r"^      repo-path: .*$", "      repo-path: zmk-totem", new, flags=re.M)
          else:
              new = new.replace("      revision:", "      repo-path: zmk-totem\n      revision:", 1)
          open(path, "w").write(text.replace(block.group(0), new))
          PY

          git config user.name zmk-bump-bot
          git config user.email actions@users.noreply.github.com
          git checkout -b "$br"
          git commit -am "Bump Totem firmware to ZMK Next ${TAG} (${SHA:0:7})"
          git push origin "$br"

          cat > /tmp/body.md <<EOF
          Moves \`config/west.yml\` to [${FORK_REPO}@${SHA:0:7}](https://github.com/${FORK_REPO}/commit/${SHA}): ZMK Next [${TAG}](https://github.com/${NEXT_REPO}/releases/tag/${TAG}) with the Totem patches merged in. The Totem firmware tests passed.

          The firmware build for this branch is started automatically; download its artifacts from the Actions tab.

          **Merge only after flashing the left half and checking:**

          - [ ] Typing on both halves, including homerow mods and combos
          - [ ] Profile switching with \`&bt BT_SEL\`
          - [ ] Only the active host stays connected
          - [ ] The selected host reconnects cleanly; USB typing stays stable
          - [ ] Retained logs can be read and live logs don't stall typing
          - [ ] Idle battery drain stays around 0.5 to 0.9 %/hr

          If anything regresses, close this PR. The keyboard stays on the current pin.
          EOF
          title="Bump Totem firmware to ZMK Next ${TAG}"
          if ! gh pr create --base "$BASE" --head "$br" --title "$title" --body-file /tmp/body.md; then
            # Opening PRs needs "Allow GitHub Actions to create and approve pull
            # requests" in the repo's Actions settings. Without it, file an issue
            # that links straight to the PR form for the pushed branch.
            compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE}...${br}?expand=1"
            { echo "New Totem firmware is ready on branch \`${br}\`. [Open the PR](${compare}) to review and merge it."; echo; cat /tmp/body.md; } > /tmp/issue.md
            gh issue create --title "$title" --body-file /tmp/issue.md
          fi

          # PRs opened with GITHUB_TOKEN don't trigger workflows, so start the
          # firmware build for the branch explicitly.
          gh workflow run build.yml --ref "$br"
          gh workflow run verify-zmk-patch.yml --ref "$br" || true

      - name: Report a merge conflict
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.merge.outputs.tag }}
        run: |
          set -euo pipefail
          title="Totem firmware: ZMK Next ${TAG} needs a manual merge"
          if [ -n "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')" ]; then
            exit 0
          fi
          {
            echo "Merging ZMK Next ${TAG} into ${FORK_REPO}@${FORK_BRANCH} conflicts in:"
            echo
            sed 's/^/- /' conflicts.txt
            echo
            echo "Resolve the merge in ${FORK_REPO}, keeping the Totem BLE, diagnostics and battery changes, then re-run this workflow. The keyboard stays on its current pin."
          } > /tmp/issue.md
          gh issue create --title "$title" --body-file /tmp/issue.md
