name: Verify ZMK patch symbols

# Fail early if config/west.yml points at a ZMK revision without the ZMK Next
# options and module API this config uses (wrong repository, an older pin, a
# renamed option), or if config/totem.conf drifts from the validated BLE policy.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-zmk-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config
        uses: actions/checkout@v5

      - name: Test diagnostics and BLE recovery
        run: python3 -m unittest discover -s tests -v

      - name: Require validated BLE policy
        shell: bash
        run: |
          set -euo pipefail

          require_config() {
            local expected="$1"
            if ! grep -qxF "$expected" config/totem.conf; then
              echo "::error::Stable BLE policy requires: $expected"
              exit 1
            fi
            echo "OK  $expected"
          }

          for expected in \
            "CONFIG_ZMK_SLEEP=n" \
            "CONFIG_TOTEM_EXCLUSIVE_HOST=y" \
            "CONFIG_TOTEM_LAZY_INACTIVE_HOST=n" \
            "CONFIG_TOTEM_EVICT_REQUIRES_BONDED_ACTIVE=y" \
            "CONFIG_ZMK_BLE_IDLE_DISCONNECT=n" \
            "CONFIG_ZMK_BLE_ADV_POST_SWITCH_DARK=n" \
            "CONFIG_ZMK_BLE_ADV_TIMEOUT=y" \
            "CONFIG_ZMK_BLE_ADV_FILTER_ACTIVE_PROFILE=y" \
            "CONFIG_ZMK_BLE_HOST_ADV_OFF_ON_USB=y" \
            "CONFIG_ZMK_USB_NO_BLE_FALLBACK_WHEN_POWERED=y" \
            "CONFIG_ZMK_BATTERY_HOLD_ON_EXTERNAL_POWER=y" \
            "CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY_SWAP=y" \
            "CONFIG_TOTEM_WATCHDOG=n" \
            "CONFIG_TOTEM_HOST_EVENT_LOG=y" \
            "CONFIG_ZMK_SPLIT_BLE_PREF_INT=12" \
            "CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400" \
            "CONFIG_BT_CTLR_TX_PWR_PLUS_8=y" \
            "CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y" \
            "CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y" \
            "CONFIG_TOTEM_RPA_DISCONNECT=n" \
            "CONFIG_TOTEM_ADV_RECONCILE=n" \
            "CONFIG_TOTEM_RECOVERY_REBOOT=n"
          do
            require_config "$expected"
          done

      - name: Resolve west.yml zmk revision
        id: rev
        run: |
          set -euo pipefail
          REV=$(awk '/name: zmk/,/revision:/ { if ($1 == "revision:") { print $2; exit } }' config/west.yml)
          REPO_PATH=$(awk '/name: zmk/,/revision:/ { if ($1 == "repo-path:") { print $2; exit } }' config/west.yml)
          REPO_PATH=${REPO_PATH:-zmk}
          if [ -z "$REV" ]; then
            echo "::error::Could not parse zmk revision from config/west.yml"
            exit 1
          fi
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "repository=rleyvasal/$REPO_PATH" >> "$GITHUB_OUTPUT"
          echo "Tracking rleyvasal/$REPO_PATH revision: $REV"

      - name: Require patched Zephyr prepare pipeline
        run: |
          set -euo pipefail
          # patches/zephyr-prepare-pipeline.patch must be in the pinned zephyr override.
          ZREV=$(awk '/name: zephyr/,/revision:/ { if ($1 == "revision:") { print $2; exit } }' config/west.yml)
          if [ -z "$ZREV" ]; then
            echo "::error::config/west.yml has no zephyr override; CI would build unpatched Zephyr"
            exit 1
          fi
          curl -fsSL "https://raw.githubusercontent.com/rleyvasal/zephyr/${ZREV}/subsys/bluetooth/controller/ll_sw/ull.c" -o ull.c
          for sym in param_normal_head_ticks param_normal_next_ticks; do
            if ! grep -q "$sym" ull.c; then
              echo "::error::Missing '${sym}' in rleyvasal/zephyr@${ZREV} ull.c — prepare-pipeline patch not applied"
              exit 1
            fi
            echo "OK  ${sym} in rleyvasal/zephyr@${ZREV}"
          done

      - name: Fetch ZMK at pinned revision
        run: |
          set -euo pipefail
          REV="${{ steps.rev.outputs.revision }}"
          REPOSITORY="${{ steps.rev.outputs.repository }}"
          git clone --filter=blob:none --no-checkout "https://github.com/${REPOSITORY}.git" zmk
          git -C zmk fetch --depth 1 origin "$REV"
          git -C zmk checkout FETCH_HEAD
          git -C zmk rev-parse HEAD

      - name: Require post-settings-load startup hook
        run: |
          set -euo pipefail
          git -C zmk grep -q '^#define ZMK_SETTINGS_LOADED_HOOK_VERSION 1$' -- app/include/zmk/settings.h
          git -C zmk grep -q 'zmk_settings_loaded();' -- app/src/main.c

      - name: Test pinned firmware regressions
        run: |
          set -euo pipefail
          # ZMK Next's native tests (the Python harnesses under app/tests).
          for test in $(cd zmk && git ls-files 'app/tests/**/test_*.py'); do
            echo "== $test"
            python3 "zmk/$test" -v
          done

      - name: Require the ZMK Next options and API this config uses
        run: |
          set -euo pipefail
          missing=0
          # Kconfig options set in config/totem.conf and the snippets.
          for sym in \
            ZMK_BLE_ADV_TIMEOUT \
            ZMK_BLE_ADV_BOOST \
            ZMK_BLE_ADV_FILTER_ACTIVE_PROFILE \
            ZMK_BLE_RESELECT_RECONNECT \
            ZMK_BLE_PROFILE_HANDOFF \
            ZMK_BLE_DIAGNOSTIC_HOOKS \
            ZMK_BLE_HOST_ADV_OFF_ON_USB \
            ZMK_USB_NO_BLE_FALLBACK_WHEN_POWERED \
            ZMK_BATTERY_HOLD_ON_EXTERNAL_POWER \
            ZMK_BATTERY_CHARGE_STATUS \
            ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY_SWAP \
            ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_RETAIN \
            ZMK_SPLIT_BLE_IDLE_INT \
            ZMK_STUDIO_RPC_RAW_FRAMES
          do
            if ! git -C zmk grep -qE "^(menu)?config ${sym}\$" -- 'app/Kconfig' 'app/src/**/Kconfig'; then
              echo "::error::Missing Kconfig option ${sym} in the pinned ZMK"
              missing=1
            else
              echo "OK  ${sym}"
            fi
          done
          # Functions the config's modules call.
          for fn in \
            zmk_ble_host_adv_suppressed \
            zmk_ble_adv_state \
            zmk_ble_adv_wake \
            zmk_ble_adv_boost_rearm \
            zmk_ble_adv_kick \
            zmk_ble_advertising_observed \
            zmk_hog_subscription_observed \
            zmk_studio_uart_rearm \
            zmk_battery_reported_soc
          do
            if ! git -C zmk grep -q "${fn}(" -- app/include; then
              echo "::error::Missing ${fn}() in the pinned ZMK's headers"
              missing=1
            else
              echo "OK  ${fn}()"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::config/west.yml pins a ZMK without what this config needs. Pin a newer rleyvasal/zmk-next commit."
            exit 1
          fi
