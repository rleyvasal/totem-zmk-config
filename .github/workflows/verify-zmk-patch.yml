name: Verify ZMK patch symbols

# Fail the build early if west.yml points at a ZMK revision that does not contain
# our patched throttle / go-dark / boost hooks (wrong fork, unpatched main, etc.).

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-zmk-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config
        uses: actions/checkout@v5

      - name: Test diagnostics and BLE recovery
        run: python3 -m unittest discover -s tests -v

      - name: Require validated BLE policy
        shell: bash
        run: |
          set -euo pipefail

          require_config() {
            local expected="$1"
            if ! grep -qxF "$expected" config/totem.conf; then
              echo "::error::Stable BLE policy requires: $expected"
              exit 1
            fi
            echo "OK  $expected"
          }

          for expected in \
            "CONFIG_ZMK_SLEEP=n" \
            "CONFIG_TOTEM_EXCLUSIVE_HOST=y" \
            "CONFIG_TOTEM_LAZY_INACTIVE_HOST=n" \
            "CONFIG_TOTEM_EVICT_REQUIRES_BONDED_ACTIVE=y" \
            "CONFIG_TOTEM_IDLE_DISCONNECT=n" \
            "CONFIG_TOTEM_ADV_POST_SWITCH_DARK=n" \
            "CONFIG_TOTEM_WATCHDOG=n" \
            "CONFIG_TOTEM_HOST_EVENT_LOG=y" \
            "CONFIG_ZMK_SPLIT_BLE_PREF_INT=12" \
            "CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400" \
            "CONFIG_BT_CTLR_TX_PWR_PLUS_8=y" \
            "CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y" \
            "CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y" \
            "CONFIG_TOTEM_RPA_DISCONNECT=n" \
            "CONFIG_TOTEM_ADV_RECONCILE=n" \
            "CONFIG_TOTEM_RECOVERY_REBOOT=n"
          do
            require_config "$expected"
          done

      - name: Resolve west.yml zmk revision
        id: rev
        run: |
          set -euo pipefail
          REV=$(awk '/name: zmk/,/revision:/ { if ($1 == "revision:") { print $2; exit } }' config/west.yml)
          REPO_PATH=$(awk '/name: zmk/,/revision:/ { if ($1 == "repo-path:") { print $2; exit } }' config/west.yml)
          REPO_PATH=${REPO_PATH:-zmk}
          if [ -z "$REV" ]; then
            echo "::error::Could not parse zmk revision from config/west.yml"
            exit 1
          fi
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "repository=rleyvasal/$REPO_PATH" >> "$GITHUB_OUTPUT"
          echo "Tracking rleyvasal/$REPO_PATH revision: $REV"

      - name: Fetch ZMK at pinned revision
        run: |
          set -euo pipefail
          REV="${{ steps.rev.outputs.revision }}"
          REPOSITORY="${{ steps.rev.outputs.repository }}"
          git clone --filter=blob:none --no-checkout "https://github.com/${REPOSITORY}.git" zmk
          git -C zmk fetch --depth 1 origin "$REV"
          git -C zmk checkout FETCH_HEAD
          git -C zmk rev-parse HEAD

      - name: Require post-settings-load startup hook
        run: |
          set -euo pipefail
          git -C zmk grep -q '^#define ZMK_SETTINGS_LOADED_HOOK_VERSION 1$' -- app/include/zmk/settings.h
          git -C zmk grep -q 'zmk_settings_loaded();' -- app/src/main.c

      - name: Test pinned firmware regressions
        run: |
          python3 zmk/app/tests/studio/raw_tx/test_raw_tx.py -v
          python3 zmk/app/tests/ble/active_connection/test_active_connection.py -v
          python3 zmk/app/tests/ble/profile_notifications/test_profile_notifications.py -v
          python3 zmk/app/tests/settings/startup/test_settings_loaded.py -v
          python3 zmk/app/tests/battery/persistence/test_persistence.py -v

      - name: Require patch symbols in app/src/ble.c
        run: |
          set -euo pipefail
          missing=0
          # Symbols only present when patches/zmk-ble.patch is applied on the fork.
          for sym in \
            adv_throttled \
            idle_go_dark \
            idle_disconnect_work \
            totem_adv_boost_active \
            CONFIG_TOTEM_IDLE_DISCONNECT \
            CONFIG_TOTEM_ADV_BOOST \
            CONFIG_TOTEM_RESELECT_RECONNECT \
            CONFIG_TOTEM_EVICT_ADV_COOLDOWN_MS \
            open_adv_retry_work \
            active_profile_conn_foreach \
            adv_profile_index \
            totem_prepare_active_fal \
            BT_LE_ADV_OPT_FILTER_CONN \
            zmk_ble_totem_ads_suppressed \
            zmk_ble_totem_adv_boost_rearm \
            zmk_ble_totem_kick_open_adv
          do
            if ! git -C zmk grep -q "$sym" -- app/src/ble.c; then
              echo "::error::Missing '${sym}' in app/src/ble.c — fork tip is not our patched ZMK"
              missing=1
            else
              echo "OK  ${sym}"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::config/west.yml revision does not include the required BLE hooks. Update rleyvasal/zmk-next and re-pin the SHA."
            exit 1
          fi
          echo "All expected Totem/ZMK patch symbols present."
