manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: fork
      url-base: https://github.com/rleyvasal
  projects:
    - name: zmk
      remote: fork
      repo-path: zmk-totem
      # zmk-next-logs-batt: USB HID must not fall back to BLE, last-cell battery.
      # totem-studio-log (31be6fd): Studio raw frames from zmk-studio-log's
      # patches/0001-studio-raw-frames.patch replace the fork's own log hooks.
      # Must match this config branch or the left image fails to link
      # (zmk_battery_last_cell_soc, zmk_rpc_send_raw_frame, …).
      # a87562a6: preserve the last valid right-half battery reading across a
      # split disconnect; a fresh GATT read replaces it after reconnection.
      # 6848616d / d42fe223: nonblocking diagnostics and stale BLE connection checks.
      # 455194e8: finish settings loading before journal writes; offload battery saves.
      # 4d476144: link notifications do not restart profile-switch advertising.
      # d54734f2: serialized advertising and tested disconnect-before-advertise handoff.
      # 25907404: retain Zephyr's managed CCC persistence with subscription diagnostics.
      # right-charge-state (e1b99c0): CONFIG_ZMK_BATTERY_CHARGE_STATUS, the right
      # half's charge state over 0x2BED; 106c788: no charge-voltage cell level
      # remembered when booting on USB.
      revision: e1b99c0e1d1c4f1bd2223f65f3a7d28ca3c57cc9
      import: app/west.yml
    # Studio log stream, reset reason, crash capture and log history across
    # restarts for the left Studio image (see snippets/totem-studio-rpc).
    - name: zmk-studio-log
      remote: fork
      revision: 4bd62adcb701ff90d196512b6316e7a03e97ef1a
    # Overrides the zephyr project imported from zmk's app/west.yml: projects in
    # this top-level manifest take precedence over imported ones of the same name.
    # Branch v4.1.0+zmk-fixes+prepare-pipeline = zmkfirmware v4.1.0+zmk-fixes
    # (10ba6d0c) + patches/zephyr-prepare-pipeline.patch (upstream d4d923938c1a).
    # Keep the name-blocklist in sync with zmk's app/west.yml.
    - name: zephyr
      remote: fork
      revision: af2b801f362d003974aba1dd332366ecf1a368b0
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
  self:
    path: config
