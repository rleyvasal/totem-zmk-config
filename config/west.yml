manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: fork
      url-base: https://github.com/rleyvasal
  projects:
    - name: zmk
      remote: fork
      # Our fork = official ZMK @ 484a054 (2026-06-29) + patches/totem-ble.patch
      # (BLE accept-list + advertising throttle). The `totem` branch is regenerated
      # from a newer upstream SHA by scripts/update-zmk.sh — see patches/README.md.
      # Pin to a specific fork SHA here instead of the branch if you want fully
      # reproducible builds.
      revision: totem
      import: app/west.yml
  self:
    path: config
