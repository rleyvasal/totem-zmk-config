manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: fork
      url-base: https://github.com/rleyvasal
  projects:
    - name: zmk
      remote: fork
      # Our fork = official ZMK + patches/totem-ble.patch (advertising throttle +
      # idle-disconnect/go-dark). Each ZMK base gets its own branch
      # `totem-optimized-<zmk-sha>`; this revision tracks the current one
      # (base ZMK 484a054 on main, post-v0.3.0). Bumps: .github/workflows/zmk-bump.yml
      # (weekly stable-release poll + manual dispatch for main/ref). Opens a PR with
      # flashable artifacts -- see patches/README.md. Never auto-merges.
      revision: totem-optimized-484a054
      import: app/west.yml
  self:
    path: config
