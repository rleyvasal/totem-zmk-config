manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: fork
      url-base: https://github.com/rleyvasal
  projects:
    - name: zmk
      remote: fork
      repo-path: zmk-next
      # zmk-next-logs-batt: USB HID must not fall back to BLE, last-cell battery,
      # framed Studio log TX. Must match this config branch or the left image
      # fails to link (zmk_battery_last_cell_soc, zmk_rpc_tx_raw_payload, …).
      # a87562a6: preserve the last valid right-half battery reading across a
      # split disconnect; a fresh GATT read replaces it after reconnection.
      # 6848616d: diagnostic frames never block Bluetooth's workqueue.
      # d42fe223: reject stale BLE connections before sending HID reports.
      revision: d42fe2236cacb542260fe5e4f6e95494979f12b8
      import: app/west.yml
  self:
    path: config
