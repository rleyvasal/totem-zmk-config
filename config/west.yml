manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: fork
      url-base: https://github.com/rleyvasal
  projects:
    - name: zmk
      remote: fork
      repo-path: zmk-next
      # ZMK Next main after the zmk-totem patches landed as Kconfig options,
      # all off by default (rleyvasal/zmk-next #21-#28). config/totem.conf
      # turns on the ones the Totem uses: battery hold on USB and charge state,
      # the swapped BAS proxy, the idle split interval, USB-first while cabled,
      # the multi-host advertising options, and Studio raw frames for the
      # zmk-studio-log module.
      revision: 3193ba7659e3f4f094ee5a6b9982669e9b8da133
      import: app/west.yml
    # Studio log stream, reset reason, crash capture and log history across
    # restarts for the left Studio image (see snippets/totem-studio-rpc).
    - name: zmk-studio-log
      remote: fork
      # 'K' battery line and 'G' '1' requests (531e4e7); the left half's
      # battery voltage at the end of the 'K' line, " mv=<millivolts>" (#1).
      revision: 3f047d18b1e8d60fc0098782d1423c99c3ebbb0d
    # Overrides the zephyr project imported from zmk's app/west.yml: projects in
    # this top-level manifest take precedence over imported ones of the same name.
    # Branch v4.1.0+zmk-fixes+prepare-pipeline = zmkfirmware v4.1.0+zmk-fixes
    # (10ba6d0c) + patches/zephyr-prepare-pipeline.patch (upstream d4d923938c1a).
    # Branch v4.1.0+zmk-fixes+supervision-reset (ae038c05) adds on top: the
    # controller restarts the supervision countdown at every connection update
    # instant. Without it, switching the split link from the idle 60 ms back to
    # 15 ms dropped it about 1 s later (a 4 s countdown kept in 60 ms events).
    # Keep the name-blocklist in sync with zmk's app/west.yml.
    - name: zephyr
      remote: fork
      revision: ae038c052f6df868c1387f0b38a0940ac3476eb1
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
  self:
    path: config
