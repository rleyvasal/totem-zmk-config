manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: fork
      url-base: https://github.com/rleyvasal
  projects:
    - name: zmk
      remote: fork
      repo-path: zmk-next
      # zmk-next-logs-batt: USB HID must not fall back to BLE, last-cell battery,
      # framed Studio log TX. Must match this config branch or the left image
      # fails to link (zmk_battery_last_cell_soc, zmk_rpc_tx_raw_payload, …).
      # d6bc4563: when USB HID is active, suppress only computer-facing BLE
      # advertisements; the split link and Studio diagnostics remain up.
      revision: d6bc45636651ae240dc7d73990b85fb02961a168
      import: app/west.yml
  self:
    path: config
