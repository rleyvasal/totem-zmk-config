manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to a fixed ZMK commit so builds are reproducible while we debug the
      # left-half reconnect issue (was floating on `main`). This SHA also transitively
      # pins Zephyr via ZMK's own manifest. Bump deliberately, not automatically.
      # Pinned 2026-07-02 to zmk main @ 484a054 (commit dated 2026-06-29).
      revision: 484a0547078228f6957ed164523823e39fbedec4
      import: app/west.yml
  self:
    path: config
