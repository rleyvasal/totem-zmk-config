manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: fork
      url-base: https://github.com/rleyvasal
  projects:
    - name: zmk
      remote: fork
      # Our fork = official ZMK @ 484a054 (2026-06-29) + patches/totem-ble.patch
      # (advertising throttle ONLY -- no accept-list; that broke macOS and was
      # dropped). The `totem` branch is regenerated from a newer upstream SHA by
      # scripts/update-zmk.sh -- see patches/README.md. Pin to a fork SHA here
      # instead of the branch for fully reproducible builds.
      revision: totem
      import: app/west.yml
  self:
    path: config
