manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: fork
      url-base: https://github.com/rleyvasal
  projects:
    - name: zmk
      remote: fork
      # Official ZMK + patches/zmk-ble.patch (throttle, idle go-dark, adv boost).
      # Human branch label on the fork: zmk-optimized-484a054 (base upstream 484a054).
      # Pin the *commit SHA* (not the branch name) so force-pushes cannot change a
      # previously validated build. After flashing a new tip, re-pin here.
      # Bumps: .github/workflows/zmk-bump.yml opens a PR that updates this SHA.
      # RPA-aware profiles (no keys.h) + open-adv retry + reselect (da2e0361).
      revision: da2e0361cc7f3884dfc2b02ab92cb0158b33255e
      import: app/west.yml
  self:
    path: config
