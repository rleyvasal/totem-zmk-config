manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: fork
      url-base: https://github.com/rleyvasal
  projects:
    - name: zmk
      remote: fork
      repo-path: zmk-next
      # zmk-next-logs-batt: USB HID must not fall back to BLE, last-cell battery,
      # framed Studio log TX. Must match this config branch or the left image
      # fails to link (zmk_battery_last_cell_soc, zmk_rpc_tx_raw_payload, …).
      # a87562a6: preserve the last valid right-half battery reading across a
      # split disconnect; a fresh GATT read replaces it after reconnection.
      # 6848616d / d42fe223: nonblocking diagnostics and stale BLE connection checks.
      # 455194e8: finish settings loading before journal writes; offload battery saves.
      # 4d476144: link notifications do not restart profile-switch advertising.
      # d54734f2: serialized advertising and tested disconnect-before-advertise handoff.
      # 25907404: retain Zephyr's managed CCC persistence with subscription diagnostics.
      revision: 25907404f5631ca50d4eb3017f9c5bb6d2a6f3a9
      import: app/west.yml
  self:
    path: config
