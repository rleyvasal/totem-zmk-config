manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to a fixed official ZMK commit for reproducible builds. (Was briefly
      # on a fork for a BLE accept-list experiment; reverted — it broke macOS profile
      # switching, and the drop-module in ../src handles cross-talk without patching
      # ZMK.) This SHA also pins Zephyr via ZMK's own manifest.
      revision: 484a0547078228f6957ed164523823e39fbedec4
      import: app/west.yml
  self:
    path: config
