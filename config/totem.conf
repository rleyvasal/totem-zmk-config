# Validated daily-driver, week ending 2026-08-15 (see STABLE-BASELINE.md).
# Flags below match the flashed week: exclusive-host, 15 ms split, +8 dBm TX,
# hold-tap decided on release. Watchdog, host-event-log, idle-disconnect, FAL,
# lazy multi-link, and the untested 5606801c recovery pin stay off.
# Studio is enabled on the production LEFT image via build.yaml
# (snippet totem-studio-rpc + cmake-args), not this flag. A bare
# CONFIG_ZMK_STUDIO=y here also turns it on for the right half (wasted
# RAM, no RPC) and does not attach the RPC uart or disable extra CDCs.
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_KEYBOARD_NAME="Totem Home"

# Bond overwrite ON. Turning this OFF (2026-07-17) was meant to prevent silent
# key mismatch zombies, but dual-host reconnect races then failed hard and left
# profiles unusable after one good switch. Restore the pre-regression setting;
# bond integrity is handled by exclusive-host's post-encryption eviction, not by
# refusing overwrite.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# macOS shows "Connected" after sleep/wake but sends NO keystrokes: on reconnect
# macOS often restores the link without re-subscribing to HID notifications (CCC).
# Recent Zephyr (we track revision: main in west.yml) enforces subscription and
# silently drops reports -> connected-but-dead keyboard. Disable enforcement so
# ZMK always sends HID reports, even if the host didn't re-subscribe on wake.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Deep sleep OFF. On macOS, deep sleep disconnects BLE and macOS won't cleanly
# re-bond on wake (forces a full re-pair) — this was the original disconnect.
# Connected-idle keeps the link alive across Mac sleep/wake. ~days-to-a-week battery.
CONFIG_ZMK_SLEEP=n

# BLE TX power 0 dBm -> +8 dBm (2026-07-30). nRF52840 maximum; ~6x the power.
#
# Caught the actual failure with BOTH halves logging simultaneously for the first
# time: the split link dies with HCI reason 8, CONN_TIMEOUT -- a supervision
# timeout, then a rescan and reconnect 3.5 s later.
#
#   split_central_disconnected: E4:FE:EF:24:E5:D1 (reason 8)
#   start_scanning: Scanning successfully started
#   split_central_connected:    E4:FE:EF:24:E5:D1     <- 3.5 s later
#
# At a 15 ms interval a 4 s supervision timeout means ~266 CONSECUTIVE connection
# events missed. That is not marginal retries -- the radio link is genuinely lost
# for seconds. Nothing is dropped while it is up: 484 scans -> 484 peripheral
# sends -> 484 notifications received, zero errors on either half. The right half
# is not at fault and never was; the LINK fails.
#
# More TX power is the direct lever on link margin. Note the desk has a USB 2.1
# hub and an LG monitor, both classic 2.4 GHz noise sources, and both halves are
# cabled into that hub -- so physical separation is worth trying alongside this.
#
# Costs battery: TX is a small fraction of duty cycle, but this is 6x the power
# during it. If drain regresses badly against the 0.81 pts/hour baseline measured
# 2026-07-30, step down to CONFIG_BT_CTLR_TX_PWR_PLUS_5 or back to _0.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# HCI Read RSSI (totem_ble rssi on the USB-log heartbeat). SUPPORT is already y
# on nRF52840; without this flag the controller returns 127 and we print --.
# Does not change TX power or advertising. Extra RAM is one int8 per connection.
CONFIG_BT_CTLR_CONN_RSSI=y

# Host link (central <-> computer): request a lazier 15-30 ms interval (Apple-compliant).
# The host decides whether to honor it (Windows often does; macOS usually overrides).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# Charging state, both halves. The right half watches VBUS detect, keeps its BAS
# level at the last on-battery reading while USB is in, and publishes a Battery
# Level Status (0x2BED) charge state. The left subscribes to it, prints
# right=NN usb in totem_batt / 'K', and repeats it in the 0x2BED next to the
# right half's level in the host BAS. Mighty Mitts reads 2A19 only.
# While charging, the level rises by an estimate (XIAO 50 mA into the capacity set
# in totem.dtsi), up to 99. There is no "full": the XIAO's charge-status pin
# (P0.17) read "not charging" while the cell charged, so ZMK does not use it.
CONFIG_ZMK_BATTERY_CHARGE_STATUS=y
# On USB, report the last level measured on battery (kept across restarts), not
# the charge-voltage reading. Also selected by CHARGE_STATUS.
CONFIG_ZMK_BATTERY_HOLD_ON_EXTERNAL_POWER=y

# Just after charging the cell reads several percent high for a few minutes (both
# halves read 3 points high at unplug, 2026-10-15). Keep the level known at
# unplug for 5 minutes before trusting live readings again.
CONFIG_ZMK_BATTERY_SETTLE_AFTER_CHARGE_SEC=300

# Do not go dark immediately when the boost ends. Windows can take longer than
# 20 s to reconnect, and the profile-change event is also raised for ordinary
# connect/disconnect state changes. The normal 5-minute advertising throttle
# remains the finite battery cap when the selected host is genuinely absent.
CONFIG_ZMK_BLE_ADV_POST_SWITCH_DARK=n

# Directed-then-open — OFF (field fail 2026-07-21): made switches worse
# (Mac ~7s, Windows ~30s vs prior ~5s / ~15s). Code path kept for later RPA
# experiments; undirected boost only for now.
CONFIG_ZMK_BLE_DIRECTED_ADV=n
# Only used with CONFIG_ZMK_BLE_DIRECTED_ADV=y:
# CONFIG_ZMK_BLE_DIRECTED_ADV_SEC=4

# Active-host Filter Accept List — validated on profiles 0↔2, 2026-10-07.
# Bonded profiles accept only their stored identity; setup errors do not fall
# back to unfiltered advertising. Empty profiles remain open for pairing.
# Both handoffs passed with both computers awake; sleep/wake testing remains.
CONFIG_BT_FILTER_ACCEPT_LIST=y
# CONFIG_ZMK_BLE_ADV_FILTER_ACTIVE_PROFILE (the active-host filter) is in totem_left.conf.

# Stable single-host policy: keep only the selected profile connected. This
# prevents the inactive computer from being woken or consuming a second BLE
# link. Each BT_SEL performs a real reconnect, so host scan latency is expected.
# TOTEM_EXCLUSIVE_HOST also turns on ZMK Next's CONFIG_ZMK_BLE_PROFILE_HANDOFF,
# which disconnects the other hosts before advertising for a newly selected one.
CONFIG_TOTEM_EXCLUSIVE_HOST=y
CONFIG_TOTEM_LAZY_INACTIVE_HOST=n

# Guard the trap state found 2026-07-25: active profile was 4 (never paired) while
# macOS was bonded at idx 0, so exclusive host evicted the Mac on every connect --
# ~9 evictions/sec, thrash_win=16, macOS permanently greyed out, and the split slot
# table corrupted as collateral ("Failed to release peripheral slot (-22)" and
# "All devices are connected, scanning is unnecessary", so the right half could not
# join). No automatic exit existed: recovery needed a BT_SEL on a keyboard that was
# already unusable. Exclusivity has nothing to protect when the selected profile has
# no bond, so skip eviction in that case and keep the host that actually wants us.
CONFIG_TOTEM_EVICT_REQUIRES_BONDED_ACTIVE=y
# After kicking Windows while Mac is selected, do not kick again for 10 s.
# Stops Hz-rate flap (USB stutter / crosstalk). BT_SEL still evicts immediately.
CONFIG_TOTEM_BG_EVICT_IGNORE_MS=10000
CONFIG_TOTEM_BG_EVICT_CAP=4

# Bond heal OFF. Auto-clear after auth failures looked good on paper, but during
# dual-host thrash the active host can fail security a few times while the other
# machine fights for the link -- clearing the bond then bricks the profile until
# a full re-pair, which matches "worked once, then dead". Keep the code path;
# re-enable only after thrash is under control and we have logging proof of 0x05.
CONFIG_TOTEM_BOND_HEAL=n
# Only used with CONFIG_TOTEM_BOND_HEAL=y:
# CONFIG_TOTEM_BOND_HEAL_THRESHOLD=3

# After BT_SEL, if the selected host is not up: densify ads / evict background hosts,
# then perform a final non-destructive connection-table verification.
# First step waits for ADV_BOOST_SEC (so we do not reselect mid-connect and add
# another ~10s). Later steps use _SEC below. Soft reselect remains manual:
# press the same BT_SEL again. Does NOT clear bonds.
CONFIG_TOTEM_RECONNECT_WATCH=y
CONFIG_TOTEM_RECONNECT_WATCH_SEC=8

# Mid-session: when the *active* peer disconnects (peer-mapped only), arm the
# light recovery ladder (boost densify + evict background hosts + final verification). Never
# arms on Windows thrash drops while Mac is already down. Skips go-dark.
CONFIG_TOTEM_RECONNECT_WATCH_ON_ACTIVE_DOWN=y

# Log thrash window counters + CLASS_A_SUSPECT on the logging UF2. No behavior
# change alone (storm boost is a later optional PR; keep thrash detect on).
CONFIG_TOTEM_THRASH_DETECT=y
CONFIG_TOTEM_THRASH_WINDOW_SEC=10

# Persistent diagnostic black box. USB, endpoint, advertising, host BLE, split,
# reset and fault transitions are kept in RAM and flushed as rotating
# CRC-checked blocks; no callback performs a flash write directly.
CONFIG_TOTEM_HOST_EVENT_LOG_SIZE=1024
CONFIG_TOTEM_HOST_EVENT_LOG=y
# The journal's HID subscription and report events come from ZMK Next's weak
# hog.c hooks (src/hid_connection_log.c).
CONFIG_ZMK_BLE_DIAGNOSTIC_HOOKS=y
# 2026-10-15: was 16 events / 10 s. HID report counts add events every 5 s while
# typing, so that wrote flash every 10 s of typing (81 writes in 13 min), and
# Bluetooth typing lagged on both halves. A flash write or page erase stalls the
# CPU and the radio. At most one write per 5 minutes; RAM keeps the full ring.
CONFIG_TOTEM_HOST_EVENT_LOG_PERSIST_EVERY=64
CONFIG_TOTEM_HOST_EVENT_LOG_PERSIST_MIN_MS=300000
CONFIG_TOTEM_HOST_EVENT_LOG_BLOCK_SIZE=16
CONFIG_TOTEM_HOST_EVENT_LOG_SLOTS=8

# Keep the selected host link alive through keyboard idle so a key can deliver a
# BLE HID wake report. ZMK deep sleep is also disabled above. If the host itself
# drops Bluetooth while asleep, firmware cannot guarantee wake until it scans and
# reconnects; the advertising throttle still limits absent-host advertising.
CONFIG_ZMK_BLE_IDLE_DISCONNECT=n

# --- Boot diagnostics (2026-07-28) -------------------------------------------
# Two July incidents were each answered by a single line of log, after hours of
# guessing: 07-25 was an active profile that had never been paired, 07-26 was
# profile 0 holding 00:00:00:00:00:00 while macOS still had its half of the bond.
# Neither was visible on a production image, because the only source was ZMK's
# LOG_DBG and CONFIG_LOG is off. These print via printk instead, so the answers are
# on the firmware actually in use -- no reflash, which is what destroyed the live
# state on 07-26.

# A console on the production image. NOT the zmk-usb-logging snippet: selects the
# same USB/CDC/console stack minus `select LOG`, so the deferred logging subsystem
# disabled in 3046d8f for hanging profile switches stays off.

CONFIG_TOTEM_USB_CONSOLE=y

# Was the last reset a power-on, a pin reset, a brownout, or a watchdog bite?
CONFIG_TOTEM_RESET_REASON_CAPTURE=y

# Which transport is carrying HID. Off for the merge: it answered a 07-26 USB-vs-BLE
# confusion and is not part of the daily-driver week. Code path stays; turn on only
# when the next incident is "typing continues after I killed Bluetooth".
CONFIG_TOTEM_ENDPOINT_LOG=n

# Crash capture: K_ERR_* reason plus the faulting PC, held in __noinit RAM across the
# reset and printed on the next boot. A crash lands here with a PC that addr2line
# resolves against the matching zmk.elf; a hang never reaches it, so silence after an
# unexplained reset is itself the diagnosis.
CONFIG_TOTEM_FAULT_CAPTURE=y

# Hardware watchdog OFF on this branch. It is the one piece with a behaviour change
# rather than pure observation, it caused two false resets of its own on 2026-07-27
# (TASK_WDT_MIN_TIMEOUT defaulting to 100 ms made the real window 120 ms, shorter than
# an NVS page erase), and the freeze it targets has not recurred. Bring it back from
# `testing` deliberately, with evidence, not by inheritance.
CONFIG_TOTEM_WATCHDOG=n

