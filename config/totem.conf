CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_KEYBOARD_NAME="Totem Home"

# Bond overwrite ON. Turning this OFF (2026-07-17) was meant to prevent silent
# key mismatch zombies, but dual-host reconnect races then failed hard and left
# profiles unusable after one good switch. Restore the pre-regression setting;
# bond integrity is handled by exclusive-host's post-encryption eviction, not by
# refusing overwrite.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# macOS shows "Connected" after sleep/wake but sends NO keystrokes: on reconnect
# macOS often restores the link without re-subscribing to HID notifications (CCC).
# Recent Zephyr (we track revision: main in west.yml) enforces subscription and
# silently drops reports -> connected-but-dead keyboard. Disable enforcement so
# ZMK always sends HID reports, even if the host didn't re-subscribe on wake.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Deep sleep OFF. On macOS, deep sleep disconnects BLE and macOS won't cleanly
# re-bond on wake (forces a full re-pair) — this was the original disconnect.
# Connected-idle keeps the link alive across Mac sleep/wake. ~days-to-a-week battery.
CONFIG_ZMK_SLEEP=n

# --- BLE power tuning (left/central half drains fastest; deep sleep off for macOS) ---
# Split link (central <-> right half) is the central's biggest controllable draw and
# uses SEPARATE params from the host link. Unit is 1.25 ms; default is 6 (= 7.5 ms).
# 24 = 30 ms roughly quarters the split radio activity vs default. A keypress still
# relays on the next connection event (<=30 ms), which feels instant for typing.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=24

# Split-link supervision timeout. Unit is 10 ms; default 400 = 4 s. When the whole
# keyboard goes dormant (host away/asleep -> throttle pauses advertising) the
# central<->right-half link was dropping, and on wake the right half took ~1 min to
# re-scan (passive) and rejoin. 1500 = 15 s lets the halves ride out idle-radio gaps
# instead of losing each other. Worst case: a genuinely-broken split link takes up to
# 15 s to notice, which is fine for two halves that are always together.
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=1500

# Host link (central <-> computer): request a lazier 15-30 ms interval (Apple-compliant).
# The host decides whether to honor it (Windows often does; macOS usually overrides).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# Report battery level of BOTH split halves to the host (for Mighty Mitts)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Pause advertising after the selected host has been away this many minutes; a key
# press on either half resumes it. This is the main fix for the idle drain during
# the 8-9 h/day the host is away, AND it handles cross-talk for free (nothing can
# connect while not advertising). Central-only; via patches/zmk-ble.patch on the
# ZMK fork. Timer uses k_work_schedule so nearby other devices can't reset it.
# Back ON: the isolation test proved the throttle was NOT the cause of the
# cross-talk / profile-switch issue (it persisted with the throttle off). This is
# the battery fix -- stop advertising after the selected host is away this long.
# Tune after a week: raise if brief absences keep killing advertising; lower if
# idle drain while "host away but still advertising" still feels high.
CONFIG_TOTEM_ADV_THROTTLE=y
CONFIG_TOTEM_ADV_THROTTLE_TIMEOUT_MIN=5

# After profile switch (and wake from advertising-dark), advertise at 30-60 ms for
# this many seconds so the target host finds the keyboard faster, then fall back to
# ZMK's normal 100-150 ms interval. Requires the ZMK fork patch.
CONFIG_TOTEM_ADV_BOOST=y
CONFIG_TOTEM_ADV_BOOST_SEC=20

# Active-host Filter Accept List — OFF (field fail 2026-07-21).
# Enabled on 457ed52: ads OK, Mac pair OK, Win connect OK, then Mac return on
# profile 0 failed and neither host would reconnect (classic FAL + multi-host /
# RPA failure). Fail-open on start is not enough if filtered ads "succeed" but
# the wrong/stale peer is in the list. Keep code path in patches/zmk-ble.patch;
# re-enable only after RPA-safe identity FAL is proven on Mac↔Win↔Mac.
# Thrash mitigation remains exclusive-host eviction (not connect isolation).
CONFIG_TOTEM_ACTIVE_ADV_FILTER=n
# Leave accept-list Kconfig available for experiments without enabling filter ads:
# CONFIG_BT_FILTER_ACCEPT_LIST=y

# Exclusive host: drop non-active hosts. Known background profiles are dropped
# immediately (no wait for encryption) so they cannot thrash the link; unresolved
# RPAs (idx < 0) are still fail-open until identity resolves. Module only.
CONFIG_TOTEM_EXCLUSIVE_HOST=y
CONFIG_TOTEM_EXCLUSIVE_DISCONNECT_REASON=0x13

# Bond heal OFF. Auto-clear after auth failures looked good on paper, but during
# dual-host thrash the active host can fail security a few times while the other
# machine fights for the link -- clearing the bond then bricks the profile until
# a full re-pair, which matches "worked once, then dead". Keep the code path;
# re-enable only after thrash is under control and we have logging proof of 0x05.
CONFIG_TOTEM_BOND_HEAL=n
CONFIG_TOTEM_BOND_HEAL_THRESHOLD=3

# Press BT_SEL for the *already active* profile to force disconnect + re-advertise
# (soft recovery for half-dead links without full re-pair). Requires patch.
CONFIG_TOTEM_RESELECT_RECONNECT=y

# CRITICAL: must stay 0. A non-zero cooldown after dropping a background host
# also pauses advertising for the *selected* host, so Windows thrash starves
# Mac (and slows Win reconnect). Regression from 2026-07-17 dual-host test.
# 0 = re-advertise immediately when any host disconnects (pre-regression).
CONFIG_TOTEM_EVICT_ADV_COOLDOWN_MS=0

# After BT_SEL, if the selected host is not up within each step window, kick
# advertising, force-evict background hosts, then soft-drop zombie conns.
# Does NOT clear bonds. Requires fork with reselect for step-1 ad kick.
CONFIG_TOTEM_RECONNECT_WATCH=y
CONFIG_TOTEM_RECONNECT_WATCH_SEC=8

# Mid-session: when the *active* peer disconnects (peer-mapped only), arm the
# light recovery ladder (boost densify + evict bg + zombie soft-drop). Never
# arms on Windows thrash drops while Mac is already down. Skips go-dark.
CONFIG_TOTEM_RECONNECT_WATCH_ON_ACTIVE_DOWN=y

# Log thrash window counters + CLASS_A_SUSPECT on the logging UF2. No behavior
# change alone (storm boost is a later optional PR; keep thrash detect on).
CONFIG_TOTEM_THRASH_DETECT=y
CONFIG_TOTEM_THRASH_WINDOW_SEC=10

# Multi-profile host event ring: capture any profile's connect/disc/security/
# thrash/watch events while using BLE normally (no USB required for capture).
# Persist to settings so history survives reboot / UF2 flash without settings-reset.
# Dump: left combo [ + X → &host_log_dump → printk over USB serial (use
# totem_left_logging briefly, or enable CONFIG_ZMK_USB_LOGGING for a debug week).
CONFIG_TOTEM_HOST_EVENT_LOG=y
CONFIG_TOTEM_HOST_EVENT_LOG_SIZE=128
CONFIG_TOTEM_HOST_EVENT_LOG_PERSIST_EVERY=16

# Idle disconnect (Stage 3, "drop + go dark"): after this many minutes with no
# keypress, disconnect the active host AND immediately pause advertising, so it
# cannot reconnect and wake the host. A keypress resumes advertising and reconnects.
# The "go dark" is what makes overnight savings safe: an asleep host (deep OR light
# sleep, incl. plugged-in / external monitor) stays gone -> advertising paused ->
# ~0.52 %/hr, with NO wake storm, because nothing is advertising for the host to
# reconnect to until you press a key. Cost: the first keystroke or two after a
# long idle are lost while it reconnects. Lives in the throttle code
# (patches/zmk-ble.patch); requires TOTEM_ADV_THROTTLE.
# Tune after a week: lower toward 10–15 if machines sleep earlier and you want
# more overnight savings; raise if you often pause mid-work and hate reconnect.
CONFIG_TOTEM_IDLE_DISCONNECT=y
CONFIG_TOTEM_IDLE_DISCONNECT_MIN=20

