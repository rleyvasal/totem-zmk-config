# Validated daily-driver, week ending 2026-08-15 (see STABLE-BASELINE.md).
# Flags below match the flashed week: exclusive-host, 15 ms split, +8 dBm TX,
# hold-tap decided on release. Watchdog, host-event-log, idle-disconnect, FAL,
# lazy multi-link, and the untested 5606801c recovery pin stay off.
# Studio is enabled on the production LEFT image via build.yaml
# (snippet totem-studio-rpc + cmake-args), not this flag. A bare
# CONFIG_ZMK_STUDIO=y here also turns it on for the right half (wasted
# RAM, no RPC) and does not attach the RPC uart or disable extra CDCs.
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_KEYBOARD_NAME="Totem Home"

# Bond overwrite ON. Turning this OFF (2026-07-17) was meant to prevent silent
# key mismatch zombies, but dual-host reconnect races then failed hard and left
# profiles unusable after one good switch. Restore the pre-regression setting;
# bond integrity is handled by exclusive-host's post-encryption eviction, not by
# refusing overwrite.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# macOS shows "Connected" after sleep/wake but sends NO keystrokes: on reconnect
# macOS often restores the link without re-subscribing to HID notifications (CCC).
# Recent Zephyr (we track revision: main in west.yml) enforces subscription and
# silently drops reports -> connected-but-dead keyboard. Disable enforcement so
# ZMK always sends HID reports, even if the host didn't re-subscribe on wake.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Deep sleep OFF. On macOS, deep sleep disconnects BLE and macOS won't cleanly
# re-bond on wake (forces a full re-pair) — this was the original disconnect.
# Connected-idle keeps the link alive across Mac sleep/wake. ~days-to-a-week battery.
CONFIG_ZMK_SLEEP=n

# --- BLE power tuning (left/central half drains fastest; deep sleep off for macOS) ---
# Split link (central <-> right half) is the central's biggest controllable draw and
# uses SEPARATE params from the host link. Unit is 1.25 ms; default is 6 (= 7.5 ms).
# 24 = 30 ms roughly quarters the split radio activity vs default. A keypress still
# relays on the next connection event (<=30 ms), which feels instant for typing.
#
# 2026-07-30: lowered 24 -> 12 (30 ms -> 15 ms). "Feels instant for typing" was true
# for plain keys but wrong for HOLD-TAPS. The right half scanned `i` (&hmr RALT I)
# with press and release only 78 ms apart -- comfortably a tap against the 200 ms
# tapping term -- yet ALT latched on, so the RELEASE reached the central late. Every
# relayed event waits up to one connection interval and each BLE retry costs another
# full interval, so at 30 ms a 78 ms press-release has almost no margin: two or three
# retries on the release push it past 200 ms and the tap resolves as a hold. That is
# the reported symptom exactly ("pressing i activates alt hold", the stray † = Opt+T,
# and "laggy / sometimes not typing", which is what a stuck modifier looks like).
#
# The right half is provably not at fault: 4208 scans -> 4208 position events ->
# 4208 split sends, every press matched by a release, zero errors. The central relays
# in 0 ms median. Only the air hop was ever unmeasured.
#
# Costs battery on the left half, which is what the 24 was buying. Raise it back if
# the drain regression outweighs the typing fix -- but measure both, do not guess.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12

# Split-link supervision timeout. Unit is 10 ms; default 400 = 4 s. When the whole
# keyboard goes dormant (host away/asleep -> throttle pauses advertising) the
# central<->right-half link was dropping, and on wake the right half took ~1 min to
# re-scan (passive) and rejoin. 1500 = 15 s lets the halves ride out idle-radio gaps
# instead of losing each other. Worst case: a genuinely-broken split link takes up to
# 15 s to notice, which is fine for two halves that are always together.
#
# 2026-07-30: 1500 -> 400 (15 s -> 4 s, the ZMK default).
# The right half stops typing completely while the LEFT keeps typing correctly, and
# Tab+Z does not recover it -- so it is not a latched modifier (that would corrupt both
# halves) and not anything clear_reports fixes. What remains is the split link going bad
# without either side noticing. At a 15 s supervision timeout, neither half declares the
# link dead for 15 s, and the right half is simply gone for that whole window before it
# reconnects. "Stops completely, then comes back" is exactly that shape.
# 4 s cuts the dead window by ~11 s. The 1500 was chosen to ride out idle radio gaps
# when the host is away (see the 2026-07 note above); if the halves start losing each
# other during idle instead, raise it back -- this trades idle robustness for recovery
# speed, and we do not yet know which matters more here.
# NOTE this is a MITIGATION, not a fix: it shortens the outage, it does not stop it.
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# BLE TX power 0 dBm -> +8 dBm (2026-07-30). nRF52840 maximum; ~6x the power.
#
# Caught the actual failure with BOTH halves logging simultaneously for the first
# time: the split link dies with HCI reason 8, CONN_TIMEOUT -- a supervision
# timeout, then a rescan and reconnect 3.5 s later.
#
#   split_central_disconnected: E4:FE:EF:24:E5:D1 (reason 8)
#   start_scanning: Scanning successfully started
#   split_central_connected:    E4:FE:EF:24:E5:D1     <- 3.5 s later
#
# At a 15 ms interval a 4 s supervision timeout means ~266 CONSECUTIVE connection
# events missed. That is not marginal retries -- the radio link is genuinely lost
# for seconds. Nothing is dropped while it is up: 484 scans -> 484 peripheral
# sends -> 484 notifications received, zero errors on either half. The right half
# is not at fault and never was; the LINK fails.
#
# More TX power is the direct lever on link margin. Note the desk has a USB 2.1
# hub and an LG monitor, both classic 2.4 GHz noise sources, and both halves are
# cabled into that hub -- so physical separation is worth trying alongside this.
#
# Costs battery: TX is a small fraction of duty cycle, but this is 6x the power
# during it. If drain regresses badly against the 0.81 pts/hour baseline measured
# 2026-07-30, step down to CONFIG_BT_CTLR_TX_PWR_PLUS_5 or back to _0.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Host link (central <-> computer): request a lazier 15-30 ms interval (Apple-compliant).
# The host decides whether to honor it (Windows often does; macOS usually overrides).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# Split battery fetching OFF (2026-07-30).
# The central polls the peripheral's Battery Service over the split link. When that
# read fails it retries, and each attempt raises zmk_peripheral_battery_state_changed:
# a capture caught ~22 events in two seconds, all reporting 0%. ZMK's keymap and
# hold-tap processing run on the SAME system workqueue, so that storm delays key
# events -- and a delayed release is exactly what turns &hmr RALT I into a held ALT,
# which is the reported symptom ("pressing i activates alt hold").
# Cost: Mighty Mitts loses the right half's level. That reading was never trustworthy
# anyway -- it reads ~100% whenever that half is on USB, and it was the source of the
# bogus 0% values. Re-enable only if the lag turns out to be unrelated.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

# Pause advertising after the selected host has been away this many minutes; a key
# press on either half resumes it. This is the main fix for the idle drain during
# the 8-9 h/day the host is away, AND it handles cross-talk for free (nothing can
# connect while not advertising). Central-only; via patches/zmk-ble.patch on the
# ZMK fork. Timer uses k_work_schedule so nearby other devices can't reset it.
# Back ON: the isolation test proved the throttle was NOT the cause of the
# cross-talk / profile-switch issue (it persisted with the throttle off). This is
# the battery fix -- stop advertising after the selected host is away this long.
# Tune after a week: raise if brief absences keep killing advertising; lower if
# idle drain while "host away but still advertising" still feels high.
CONFIG_TOTEM_ADV_THROTTLE=y
CONFIG_TOTEM_ADV_THROTTLE_TIMEOUT_MIN=5

# After profile switch (and wake from advertising-dark), advertise at 30-60 ms for
# this many seconds so the target host finds the keyboard faster. Requires patch.
CONFIG_TOTEM_ADV_BOOST=y
CONFIG_TOTEM_ADV_BOOST_SEC=20

# Do not go dark immediately when the boost ends. Windows can take longer than
# 20 s to reconnect, and the profile-change event is also raised for ordinary
# connect/disconnect state changes. The normal 5-minute advertising throttle
# remains the finite battery cap when the selected host is genuinely absent.
CONFIG_TOTEM_ADV_POST_SWITCH_DARK=n

# Directed-then-open — OFF (field fail 2026-07-21): made switches worse
# (Mac ~7s, Windows ~30s vs prior ~5s / ~15s). Code path kept for later RPA
# experiments; undirected boost only for now.
CONFIG_TOTEM_DIR_THEN_OPEN=n
CONFIG_TOTEM_DIR_ADV_SEC=4

# Active-host Filter Accept List — OFF (field fail 2026-07-21).
# Enabled on 457ed52: ads OK, Mac pair OK, Win connect OK, then Mac return on
# profile 0 failed and neither host would reconnect (classic FAL + multi-host /
# RPA failure). Fail-open on start is not enough if filtered ads "succeed" but
# the wrong/stale peer is in the list. Keep code path in patches/zmk-ble.patch;
# re-enable only after RPA-safe identity FAL is proven on Mac↔Win↔Mac.
# Thrash mitigation remains exclusive-host eviction (not connect isolation).
CONFIG_TOTEM_ACTIVE_ADV_FILTER=n
# Leave accept-list Kconfig available for experiments without enabling filter ads:
# CONFIG_BT_FILTER_ACCEPT_LIST=y

# Stable single-host policy: keep only the selected profile connected. This
# prevents the inactive computer from being woken or consuming a second BLE
# link. Each BT_SEL performs a real reconnect, so host scan latency is expected.
CONFIG_TOTEM_EXCLUSIVE_HOST=y
CONFIG_TOTEM_EXCLUSIVE_DISCONNECT_REASON=0x13
CONFIG_TOTEM_LAZY_INACTIVE_HOST=n

# Guard the trap state found 2026-07-25: active profile was 4 (never paired) while
# macOS was bonded at idx 0, so exclusive host evicted the Mac on every connect --
# ~9 evictions/sec, thrash_win=16, macOS permanently greyed out, and the split slot
# table corrupted as collateral ("Failed to release peripheral slot (-22)" and
# "All devices are connected, scanning is unnecessary", so the right half could not
# join). No automatic exit existed: recovery needed a BT_SEL on a keyboard that was
# already unusable. Exclusivity has nothing to protect when the selected profile has
# no bond, so skip eviction in that case and keep the host that actually wants us.
CONFIG_TOTEM_EVICT_REQUIRES_BONDED_ACTIVE=y

# Bond heal OFF. Auto-clear after auth failures looked good on paper, but during
# dual-host thrash the active host can fail security a few times while the other
# machine fights for the link -- clearing the bond then bricks the profile until
# a full re-pair, which matches "worked once, then dead". Keep the code path;
# re-enable only after thrash is under control and we have logging proof of 0x05.
CONFIG_TOTEM_BOND_HEAL=n
CONFIG_TOTEM_BOND_HEAL_THRESHOLD=3

# Press BT_SEL for the *already active* profile to force disconnect + re-advertise
# (soft recovery for half-dead links without full re-pair). Requires patch.
CONFIG_TOTEM_RESELECT_RECONNECT=y

# CRITICAL: must stay 0. A non-zero cooldown after dropping a background host
# also pauses advertising for the *selected* host, so Windows thrash starves
# Mac (and slows Win reconnect). Regression from 2026-07-17 dual-host test.
# 0 = re-advertise immediately when any host disconnects (pre-regression).
CONFIG_TOTEM_EVICT_ADV_COOLDOWN_MS=0

# After BT_SEL, if the selected host is not up: densify ads / evict bg / zombie.
# First step waits for ADV_BOOST_SEC (so we do not reselect mid-connect and add
# another ~10s). Later steps use _SEC below. Soft reselect remains manual:
# press the same BT_SEL again. Does NOT clear bonds.
CONFIG_TOTEM_RECONNECT_WATCH=y
CONFIG_TOTEM_RECONNECT_WATCH_SEC=8

# Mid-session: when the *active* peer disconnects (peer-mapped only), arm the
# light recovery ladder (boost densify + evict bg + zombie soft-drop). Never
# arms on Windows thrash drops while Mac is already down. Skips go-dark.
CONFIG_TOTEM_RECONNECT_WATCH_ON_ACTIVE_DOWN=y

# Log thrash window counters + CLASS_A_SUSPECT on the logging UF2. No behavior
# change alone (storm boost is a later optional PR; keep thrash detect on).
CONFIG_TOTEM_THRASH_DETECT=y
CONFIG_TOTEM_THRASH_WINDOW_SEC=10

# Multi-profile host event ring: capture any profile's connect/disc/security/
# thrash/watch events while using BLE normally (no USB required for capture).
# Persist to settings so history survives reboot / UF2 flash without settings-reset.
# Dump: left combo [ + X → &host_log_dump → printk over USB serial (use
# totem_left_logging briefly, or enable CONFIG_ZMK_USB_LOGGING for a debug week).
# OFF. The baseline predates 3046d8f ("disable logging to resolve hang during profile
# switching"), so inheriting =y here is an accident of branching, not a decision. The
# boot-time reset reason and profile dump (below) cover what the ring was used for,
# without the flash writes that were blamed for the hang. Turn on only with evidence.
CONFIG_TOTEM_HOST_EVENT_LOG=n
CONFIG_TOTEM_HOST_EVENT_LOG_SIZE=128
CONFIG_TOTEM_HOST_EVENT_LOG_PERSIST_EVERY=32
# Thrash can generate dozens of events/sec; flash NVS that often can freeze the
# left half (no BLE, no USB HID) until power-cycle. RAM ring is fine; throttle flash.
CONFIG_TOTEM_HOST_EVENT_LOG_PERSIST_MIN_MS=60000

# Keep the selected host link alive through keyboard idle so a key can deliver a
# BLE HID wake report. ZMK deep sleep is also disabled above. If the host itself
# drops Bluetooth while asleep, firmware cannot guarantee wake until it scans and
# reconnects; the advertising throttle still limits absent-host advertising.
CONFIG_TOTEM_IDLE_DISCONNECT=n

# --- Boot diagnostics (2026-07-28) -------------------------------------------
# Two July incidents were each answered by a single line of log, after hours of
# guessing: 07-25 was an active profile that had never been paired, 07-26 was
# profile 0 holding 00:00:00:00:00:00 while macOS still had its half of the bond.
# Neither was visible on a production image, because the only source was ZMK's
# LOG_DBG and CONFIG_LOG is off. These print via printk instead, so the answers are
# on the firmware actually in use -- no reflash, which is what destroyed the live
# state on 07-26.

# A console on the production image. NOT the zmk-usb-logging snippet: selects the
# same USB/CDC/console stack minus `select LOG`, so the deferred logging subsystem
# disabled in 3046d8f for hanging profile switches stays off.
CONFIG_TOTEM_USB_CONSOLE=y

# Was the last reset a power-on, a pin reset, a brownout, or a watchdog bite?
CONFIG_TOTEM_RESET_REASON_CAPTURE=y

# Every profile's stored host address at boot, active marked *, empty marked EMPTY.
# Printed from delayed work, NOT SYS_INIT: settings_load() runs in ZMK's main() after
# all SYS_INIT levels, so an init-time read reports all-zeroes on a keyboard whose
# bonds are perfectly fine.
CONFIG_TOTEM_BOOT_PROFILE_DUMP=y
CONFIG_TOTEM_BOOT_PROFILE_DUMP_DELAY_MS=4000

# Which transport is carrying HID. Off for the merge: it answered a 07-26 USB-vs-BLE
# confusion and is not part of the daily-driver week. Code path stays; turn on only
# when the next incident is "typing continues after I killed Bluetooth".
CONFIG_TOTEM_ENDPOINT_LOG=n

# Crash capture: K_ERR_* reason plus the faulting PC, held in __noinit RAM across the
# reset and printed on the next boot. A crash lands here with a PC that addr2line
# resolves against the matching zmk.elf; a hang never reaches it, so silence after an
# unexplained reset is itself the diagnosis.
CONFIG_TOTEM_FAULT_CAPTURE=y

# Hardware watchdog OFF on this branch. It is the one piece with a behaviour change
# rather than pure observation, it caused two false resets of its own on 2026-07-27
# (TASK_WDT_MIN_TIMEOUT defaulting to 100 ms made the real window 120 ms, shorter than
# an NVS page erase), and the freeze it targets has not recurred. Bring it back from
# `testing` deliberately, with evidence, not by inheritance.
CONFIG_TOTEM_WATCHDOG=n

# Both halves' battery, timestamped, on the console. Host-side readouts are useless
# for measurement: ZMK reports 100%% for anything >= 4200 mV, so a half on USB always
# reads full. Measure the RIGHT half on its own cell while the LEFT is on USB -- the
# level arrives over the split link.
CONFIG_TOTEM_BATTERY_LOG=y
CONFIG_TOTEM_BATTERY_LOG_INTERVAL_SEC=300

# These three live in the later fork pin (5606801c) that main grew after the
# 07-23 split. They are NOT in 074df9b, which is what this week actually ran.
# Kconfig defaults are y, so pin them n: a future west bump must not silently
# arm an auto-reboot or change disconnect behavior without a dedicated A/B.
CONFIG_TOTEM_RPA_DISCONNECT=n
CONFIG_TOTEM_ADV_RECONCILE=n
CONFIG_TOTEM_RECOVERY_REBOOT=n
