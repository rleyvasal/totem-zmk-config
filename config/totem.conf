CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_KEYBOARD_NAME="Totem Home"

# Re-bond cleanly after macOS wakes
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# macOS shows "Connected" after sleep/wake but sends NO keystrokes: on reconnect
# macOS often restores the link without re-subscribing to HID notifications (CCC).
# Recent Zephyr (we track revision: main in west.yml) enforces subscription and
# silently drops reports -> connected-but-dead keyboard. Disable enforcement so
# ZMK always sends HID reports, even if the host didn't re-subscribe on wake.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Deep sleep OFF. On macOS, deep sleep disconnects BLE and macOS won't cleanly
# re-bond on wake (forces a full re-pair) — this was the original disconnect.
# Connected-idle keeps the link alive across Mac sleep/wake. ~days-to-a-week battery.
CONFIG_ZMK_SLEEP=n

# --- BLE power tuning (left/central half drains fastest; deep sleep off for macOS) ---
# Split link (central <-> right half) is the central's biggest controllable draw and
# uses SEPARATE params from the host link. Default interval is 7.5 ms; raising it to
# 15 ms roughly halves the split radio activity. Latency 30 keeps typing instant
# (a keypress still relays on the next event, <=15 ms).
CONFIG_ZMK_SPLIT_BLE_PREF_INT=24

# Host link (central <-> computer): request a lazier 15-30 ms interval (Apple-compliant).
# The host decides whether to honor it (Windows often does; macOS usually overrides).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# Report battery level of BOTH split halves to the host (for Mighty Mitts)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# OFF permanently. Any address/profile-based host filtering breaks macOS, which
# uses rotating private addresses (RPA) -- the Mac connects but can't type, while
# Windows (fixed address) works. We tried this three ways (drop-module, accept-list,
# RPA-safe) and macOS broke every time.
CONFIG_TOTEM_ACTIVE_PROFILE_ONLY=n

# OFF. A keyboard-initiated disconnect makes macOS reconnect WITHOUT re-subscribing
# to HID -> "connected but can't type." (macOS-initiated disconnects -- Bluetooth
# off/on, out of range -- re-subscribe fine; only keyboard-forced ones break.) So we
# can't force the host off on a profile switch. Switch computers manually instead:
# turn Bluetooth off on the one you're leaving (clean, host-initiated), on for the
# one you're joining. Windows is unaffected, but macOS makes this a dead end.
CONFIG_TOTEM_DISCONNECT_ON_PROFILE_SWITCH=n

# Pause advertising after the selected host has been away this many minutes; a key
# press on either half resumes it. This is the main fix for the idle drain during
# the 8-9 h/day the host is away, AND it handles cross-talk for free (nothing can
# connect while not advertising). Central-only; via patches/totem-ble.patch on the
# ZMK fork. Timer uses k_work_schedule so nearby other devices can't reset it.
# Back ON: the isolation test proved the throttle was NOT the cause of the
# cross-talk / profile-switch issue (it persisted with the throttle off). This is
# the battery fix -- stop advertising after the selected host is away this long.
CONFIG_TOTEM_ADV_THROTTLE=y
CONFIG_TOTEM_ADV_THROTTLE_TIMEOUT_MIN=5

# Exclusive host: evict background (non-active) connections so only the selected
# computer stays connected -- this is the cross-talk fix. Generic, no hardcoded
# profile/host info. On connect and on profile switch, drop any non-active host; a
# host still resolving its address is left alone so an active reconnect is never
# killed. Verified both directions on macOS + Windows with reason 0x13: the
# non-active machine shows disconnected, and the selected one (macOS included)
# reconnects and types cleanly -- no "connected but can't type", no silent
# keystrokes when the Mac sleeps. Works where the older mid-switch disconnect
# failed because it evicts from the post-switch profile-changed event, not from
# inside zmk_ble_prof_select. Reverts with =n.
# Module: src/exclusive_host.c, central-only, no ZMK patch.
CONFIG_TOTEM_EXCLUSIVE_HOST=y
# HCI disconnect reason for eviction. 0x13 (remote user terminated) works; the
# 0x15 / 0x1A fallbacks were never needed.
CONFIG_TOTEM_EXCLUSIVE_DISCONNECT_REASON=0x13

# Idle disconnect (Stage 3): after this many minutes with no keypress, disconnect
# the active host so the advertising throttle can pause. macOS holds its BLE link
# alive during sleep, so without this the keyboard stays connected-idle overnight
# (~1.86 %/hr) and the throttle never engages. Dropping the idle host lets it fall
# to the throttled ~0.86 %/hr. An awake host just reconnects cleanly (reason 0x13,
# proven by the exclusive-host module); cost is the first keystroke after a long
# idle. 20 min is long enough to rarely fire during active daytime use but still
# kick in overnight -- raise it if you see daytime disconnect blips. Reverts with =n.
# Module: src/idle_disconnect.c, central-only, no ZMK patch.
CONFIG_TOTEM_IDLE_DISCONNECT=y
CONFIG_TOTEM_IDLE_DISCONNECT_MIN=20

