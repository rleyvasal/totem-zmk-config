# Left half (split central) only. ZMK reads this after config/totem.conf for
# the totem_left shield, so the Studio and logging left images get it too.
# These options depend on the split central role or on USB; on the right half
# they did nothing except produce Kconfig warnings.

# --- BLE power tuning (left/central half drains fastest; deep sleep off for macOS) ---
# Split link (central <-> right half) is the central's biggest controllable draw and
# uses SEPARATE params from the host link. Unit is 1.25 ms; default is 6 (= 7.5 ms).
# 24 = 30 ms roughly quarters the split radio activity vs default. A keypress still
# relays on the next connection event (<=30 ms), which feels instant for typing.
#
# 2026-07-30: lowered 24 -> 12 (30 ms -> 15 ms). "Feels instant for typing" was true
# for plain keys but wrong for HOLD-TAPS. The right half scanned `i` (&hmr RALT I)
# with press and release only 78 ms apart -- comfortably a tap against the 200 ms
# tapping term -- yet ALT latched on, so the RELEASE reached the central late. Every
# relayed event waits up to one connection interval and each BLE retry costs another
# full interval, so at 30 ms a 78 ms press-release has almost no margin: two or three
# retries on the release push it past 200 ms and the tap resolves as a hold. That is
# the reported symptom exactly ("pressing i activates alt hold", the stray † = Opt+T,
# and "laggy / sometimes not typing", which is what a stuck modifier looks like).
#
# The right half is provably not at fault: 4208 scans -> 4208 position events ->
# 4208 split sends, every press matched by a release, zero errors. The central relays
# in 0 ms median. Only the air hop was ever unmeasured.
#
# Costs battery on the left half, which is what the 24 was buying. Raise it back if
# the drain regression outweighs the typing fix -- but measure both, do not guess.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12

# Idle split interval (2026-10-15). The left half runs the split link, and the
# side running a link sends on every connection event, so at 15 ms the split
# link is the left half's largest draw (est. 250-400 uA) even when nothing is
# typed. After CONFIG_ZMK_IDLE_TIMEOUT (30 s) without a key, switch it to 60 ms
# (48 x 1.25 ms): about a quarter of the events. The first key press switches
# back to 15 ms, which takes effect a few 60 ms intervals later, so only the
# first keystrokes after a 30 s pause ride the slower link.
# If hold-taps misfire right after a pause, lower this toward 24 (30 ms); 0
# disables it.
CONFIG_ZMK_SPLIT_BLE_IDLE_INT=48
# Latency 30 at 60 ms (right half asleep up to 1.86 s) dropped the split link
# (reason 0x08) right after 4 of 5 switches back to 15 ms, 2026-10-15. With 4 the
# right half listens every 300 ms while idle (it listens every 465 ms at 15 ms /
# latency 30), so its cost barely changes; the left's saving does not depend on it.
CONFIG_ZMK_SPLIT_BLE_IDLE_LATENCY=4
# Print every link interval, latency and timeout when they change (totem_ble conn_params).
CONFIG_TOTEM_CONN_PARAMS_LOG=y

# Split-link supervision timeout. Unit is 10 ms; default 400 = 4 s. When the whole
# keyboard goes dormant (host away/asleep -> throttle pauses advertising) the
# central<->right-half link was dropping, and on wake the right half took ~1 min to
# re-scan (passive) and rejoin. 1500 = 15 s lets the halves ride out idle-radio gaps
# instead of losing each other. Worst case: a genuinely-broken split link takes up to
# 15 s to notice, which is fine for two halves that are always together.
#
# 2026-07-30: 1500 -> 400 (15 s -> 4 s, the ZMK default).
# The right half stops typing completely while the LEFT keeps typing correctly, and
# Tab+Z does not recover it -- so it is not a latched modifier (that would corrupt both
# halves) and not anything clear_reports fixes. What remains is the split link going bad
# without either side noticing. At a 15 s supervision timeout, neither half declares the
# link dead for 15 s, and the right half is simply gone for that whole window before it
# reconnects. "Stops completely, then comes back" is exactly that shape.
# 4 s cuts the dead window by ~11 s. The 1500 was chosen to ride out idle radio gaps
# when the host is away (see the 2026-07 note above); if the halves start losing each
# other during idle instead, raise it back -- this trades idle robustness for recovery
# speed, and we do not yet know which matters more here.
# NOTE this is a MITIGATION, not a fix: it shortens the outage, it does not stop it.
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# Split battery fetch ON so totem_batt / Mighty Mitts can show right=NN%.
# PROXY publishes the right half as a second BAS characteristic (what Mighty
# Mitts reads). GATT notifies are rate-limited in central_bas_proxy.c so a
# failed-read 0% storm cannot stall HID. If typing lags or right=0% repeats
# rapidly, set FETCHING=n (that also drops PROXY). Left on USB is charge
# voltage, not SoC — log prints left=usb and BAS is not updated to 100%.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Mighty Mitts reads the primary BAS as the right half and the extra one as the
# left: report the right half in the primary BAS and this half ("Left") in the
# extra one.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY_SWAP=y
# A split disconnect has no battery reading: keep the right half's last level
# instead of showing 0% until the next read after reconnecting.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_RETAIN=y

# Pause advertising after the selected host has been away this many minutes; a key
# press on either half resumes it. This is the main fix for the idle drain during
# the 8-9 h/day the host is away, AND it handles cross-talk for free (nothing can
# connect while not advertising). Central-only; ZMK Next's
# CONFIG_ZMK_BLE_ADV_TIMEOUT. Timer uses k_work_schedule so nearby other devices
# can't reset it.
# Back ON: the isolation test proved the throttle was NOT the cause of the
# cross-talk / profile-switch issue (it persisted with the throttle off). This is
# the battery fix -- stop advertising after the selected host is away this long.
# Tune after a week: raise if brief absences keep killing advertising; lower if
# idle drain while "host away but still advertising" still feels high.
CONFIG_ZMK_BLE_ADV_TIMEOUT=y
CONFIG_ZMK_BLE_ADV_TIMEOUT_MIN=5

# After profile switch (and wake from advertising-dark), advertise at 30-60 ms for
# this many seconds so the target host finds the keyboard faster.
CONFIG_ZMK_BLE_ADV_BOOST=y
CONFIG_ZMK_BLE_ADV_BOOST_SEC=20

# Active-host Filter Accept List (see totem.conf for the history).
CONFIG_ZMK_BLE_ADV_FILTER_ACTIVE_PROFILE=y

# HCI reason the profile handoff and the exclusive-host module use to disconnect
# a background host (0x13, remote user terminated).
CONFIG_ZMK_BLE_PROFILE_HANDOFF_DISCONNECT_REASON=0x13

# Press BT_SEL for the *already active* profile to force disconnect + re-advertise
# (soft recovery for half-dead links without full re-pair).
CONFIG_ZMK_BLE_RESELECT_RECONNECT=y

# CRITICAL: must stay 0. A non-zero cooldown after dropping a background host
# also pauses advertising for the *selected* host, so Windows thrash starves
# Mac (and slows Win reconnect). Regression from 2026-07-17 dual-host test.
# 0 = re-advertise immediately when any host disconnects (pre-regression).
CONFIG_ZMK_BLE_EVICT_ADV_COOLDOWN_MS=0

# While USB HID is active, disconnect existing computer BLE links once
# (TOTEM_USB_QUIET_HOST) and keep host advertising off (ZMK Next's
# CONFIG_ZMK_BLE_HOST_ADV_OFF_ON_USB). The split link and USB Studio diagnostics
# stay available; unplugging immediately re-enables host BLE.
CONFIG_TOTEM_USB_QUIET_HOST=y
CONFIG_ZMK_BLE_HOST_ADV_OFF_ON_USB=y
# macOS drops the BLE keyboard when the same keyboard appears on USB, so while
# the cable is in, wait for USB HID instead of falling back to BLE.
CONFIG_ZMK_USB_NO_BLE_FALLBACK_WHEN_POWERED=y

# Every profile's stored host address at boot, active marked *, empty marked EMPTY.
# Printed from delayed work, NOT SYS_INIT: settings_load() runs in ZMK's main() after
# all SYS_INIT levels, so an init-time read reports all-zeroes on a keyboard whose
# bonds are perfectly fine.
CONFIG_TOTEM_BOOT_PROFILE_DUMP=y
CONFIG_TOTEM_BOOT_PROFILE_DUMP_DELAY_MS=4000

# Both halves' battery, timestamped, on the console. A half on USB prints left=usb
# (charge voltage is not SoC). Measure the RIGHT half on its own cell while the LEFT
# is on USB -- the level arrives over the split link and is also PROXY'd to Mighty Mitts.
CONFIG_TOTEM_BATTERY_LOG=y
CONFIG_TOTEM_BATTERY_LOG_INTERVAL_SEC=300
