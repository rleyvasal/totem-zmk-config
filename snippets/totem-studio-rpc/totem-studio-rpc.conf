CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_TOTEM_USB_CONSOLE=n
# Printk on the existing board CDC (usbmodem101), not a third interface.
# Studio RPC stays on the snippet CDC (usbmodem104).
CONFIG_TOTEM_STUDIO_CONSOLE=y
# Probe only: skip the unlock dialog. Q+B sat on the same half as combos that
# already failed; locking is a client convenience, not a security boundary here.
CONFIG_ZMK_STUDIO_LOCKING=n
