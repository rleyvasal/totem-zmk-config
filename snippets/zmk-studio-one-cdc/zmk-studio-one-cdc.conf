CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_CONSOLE=n
CONFIG_ZMK_STUDIO_CONSOLE=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_LOCKING=n
# Log stream, crash capture, reset reason and log history across restarts come
# from the zmk-studio-log module on this image. Totem's journal keeps recording
# the same boot and fault events (read from the module), and the right half and
# non-Studio images keep Totem's own capture.
CONFIG_ZMK_STUDIO_LOG=y
CONFIG_ZMK_STUDIO_LOG_QUEUE=32
CONFIG_ZMK_STUDIO_LOG_RESTART_DIAG=y
