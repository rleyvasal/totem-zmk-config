<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Totem keymap editor</title>
    <link rel="stylesheet" href="css/editor.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Totem <span>keymap</span></h1>
        <p>Fixed geometry. Bindings move. Only <code>totem.keymap</code> tokens change.</p>
      </div>
      <div class="toolbar">
        <span id="dirty" class="dirty" hidden>unsaved</span>
        <label class="file-btn">
          Open keymap
          <input id="open-file" type="file" accept=".keymap,.dtsi,text/*" hidden />
        </label>
        <button id="reload">Reload from repo</button>
        <button id="download" class="primary">Download keymap</button>
        <button id="svg">Download SVG</button>
      </div>
    </header>
    <main>
      <section class="board">
        <div id="layers" class="layers"></div>
        <svg id="keyboard" class="keyboard" xmlns="http://www.w3.org/2000/svg"></svg>
      </section>
      <aside class="side">
        <h2>Binding palette</h2>
        <select id="category" aria-label="Palette category">
          <option value="Alphabetical">Alphabetical</option>
        </select>
        <input id="search" type="search" placeholder="Search letters…" />
        <div id="palette" class="palette"></div>
        <div class="inspect" id="inspect">
          <div>No key selected</div>
        </div>
      </aside>
    </main>
    <div class="status" id="status">Load a keymap to begin.</div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
